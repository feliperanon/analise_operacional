<!--
DESIGN TOKENS - Mobile Design System (Operacional)
Regras: cor só com significado operacional; hierarquia clara; mínima carga cognitiva.
-->

<style>
    :root {
        /* === CORES (RÍGIDO) === */
        --color-bg: #f8fafc;                    /* slate-50 - background padrão */
        --color-surface: #ffffff;               /* superfície principal */
        --color-border: #e2e8f0;                /* slate-200 */
        --color-border-light: #f1f5f9;           /* slate-100 */

        --color-text: #0f172a;                   /* slate-900 - primário */
        --color-text-secondary: #475569;         /* slate-600 */
        --color-text-muted: #94a3b8;             /* slate-400 */
        --color-text-inverse: #ffffff;

        --color-icon: #64748b;                   /* slate-500 - ícones padrão */

        /* Azul: SOMENTE ações primárias, estados ativos, logomarca */
        --color-action: #2563eb;                 /* blue-600 - ações */
        --color-primary: #1e3a8a;                /* blue-900 - botão primário, ativo, logo */
        --color-primary-bg: #eff6ff;              /* blue-50 - bg ativo leve */
        --color-primary-border: #dbeafe;        /* blue-100 */

        /* Estados funcionais (só quando necessário) */
        --color-success: #16a34a;
        --color-success-bg: #dcfce7;
        --color-danger: #dc2626;
        --color-danger-bg: #fee2e2;
        --color-warning: #ca8a04;
        --color-warning-bg: #fef9c3;

        /* === TIPOGRAFIA (MOBILE-FIRST) === */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: ui-monospace, monospace;

        --text-caption: 0.6875rem;   /* 11px */
        --text-caption-lg: 0.75rem;  /* 12px */
        --text-body: 0.8125rem;      /* 13px */
        --text-body-lg: 0.875rem;    /* 14px */
        --text-section: 0.875rem;    /* 14px - títulos de seção */
        --text-section-lg: 1rem;     /* 16px */
        --text-title: 1rem;          /* 16px */
        --text-title-lg: 1.125rem;   /* 18px */

        --font-normal: 400;
        --font-medium: 500;
        --font-semibold: 600;

        --leading-tight: 1.25;
        --leading-normal: 1.5;

        /* === ESPAÇAMENTO (4px grid) === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;

        /* === BORDAS === */
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.25rem;
        --border: 1px solid var(--color-border);
        --border-2: 2px solid var(--color-border);

        /* === SOMBRAS (leve, não decorativa) === */
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06);
        --shadow-modal: 0 4px 12px rgba(15, 23, 42, 0.1);

        /* === INTERAÇÃO === */
        --color-input-bg: #ffffff;
        --color-hover: #f1f5f9;

        /* === TOUCH === */
        --touch-min: 44px;
        --touch-icon: 40px;

        /* === TRANSIÇÃO === */
        --ease: 200ms cubic-bezier(0.4, 0, 0.2, 1);

        /* === Z === */
        --z-dropdown: 10;
        --z-sticky: 20;
        --z-modal-bg: 40;
        --z-modal: 50;
    }

    /* Containers */
    .container-mobile {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding-left: var(--space-4);
        padding-right: var(--space-4);
    }

    /* Card: branco, borda suave OU sombra leve (não ambos) */
    .surface {
        background: var(--color-surface);
        border: var(--border);
        border-radius: var(--radius-lg);
    }

    .surface-shadow {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
    }

    /* Container de ícone: neutro */
    .icon-wrap {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        background: var(--color-border-light);
        color: var(--color-icon);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-wrap-sm {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: var(--color-border-light);
        color: var(--color-icon);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Tipografia */
    .text-title {
        font-size: var(--text-title);
        font-weight: var(--font-semibold);
        color: var(--color-text);
        line-height: var(--leading-tight);
    }

    .text-title-lg {
        font-size: var(--text-title-lg);
        font-weight: var(--font-semibold);
        color: var(--color-text);
        line-height: var(--leading-tight);
    }

    .text-section {
        font-size: var(--text-section);
        font-weight: var(--font-semibold);
        color: var(--color-text);
    }

    .text-body {
        font-size: var(--text-body);
        font-weight: var(--font-normal);
        color: var(--color-text-secondary);
        line-height: var(--leading-normal);
    }

    .text-body-lg {
        font-size: var(--text-body-lg);
        color: var(--color-text-secondary);
    }

    .text-caption {
        font-size: var(--text-caption);
        color: var(--color-text-muted);
    }

    .text-caption-lg {
        font-size: var(--text-caption-lg);
        color: var(--color-text-muted);
    }

    /* Touch targets */
    .touch-target {
        min-width: var(--touch-min);
        min-height: var(--touch-min);
    }

    .touch-target-icon {
        min-width: var(--touch-icon);
        min-height: var(--touch-icon);
    }

    /* Interação (sem decoração) */
    .interactive {
        transition: opacity var(--ease), background-color var(--ease);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .interactive:active {
        opacity: 0.9;
    }

    .disabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
