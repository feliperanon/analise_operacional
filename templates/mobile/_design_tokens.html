<!--
DESIGN TOKENS - PWA Elite | Sistema Souza Pinto
Glassmorfismo, sombras dinâmicas, gradientes operacionais.
-->

<style>
    :root {
        /* === CORES === */
        --color-bg: #f1f5f9;
        --color-surface: #ffffff;
        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;

        --color-text: #0f172a;
        --color-text-secondary: #475569;
        --color-text-muted: #94a3b8;
        --color-text-inverse: #ffffff;

        --color-icon: #64748b;

        --color-action: #2563eb;
        --color-primary: #1e3a8a;
        --color-primary-bg: #eff6ff;
        --color-primary-border: #dbeafe;

        --color-success: #16a34a;
        --color-success-bg: #dcfce7;
        --color-danger: #dc2626;
        --color-danger-bg: #fee2e2;
        --color-warning: #ca8a04;
        --color-warning-bg: #fef9c3;

        /* (Glass removido - fundos 100% sólidos para legibilidade ao sol) */

        /* === SOMBRAS DINÂMICAS === */
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-elevated: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
        --shadow-xl: 0 20px 40px rgba(15, 23, 42, 0.12);
        --shadow-modal: 0 24px 48px rgba(15, 23, 42, 0.16);

        /* === GRADIENTES OPERACIONAIS === */
        --gradient-header: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);

        /* === TIPOGRAFIA === */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: ui-monospace, monospace;

        --text-caption: 0.6875rem;   /* 11px */
        --text-caption-lg: 0.75rem;  /* 12px */
        --text-body: 0.8125rem;      /* 13px */
        --text-body-lg: 0.875rem;    /* 14px */
        --text-section: 0.875rem;    /* 14px - títulos de seção */
        --text-section-lg: 1rem;     /* 16px */
        --text-title: 1rem;          /* 16px */
        --text-title-lg: 1.125rem;   /* 18px */

        --font-normal: 400;
        --font-medium: 500;
        --font-semibold: 600;

        --leading-tight: 1.25;
        --leading-normal: 1.5;

        /* === ESPAÇAMENTO (4px grid) === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;

        /* === BORDAS === */
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.25rem;
        --border: 1px solid var(--color-border);
        --border-2: 2px solid var(--color-border);

        /* === INTERAÇÃO === */
        --color-input-bg: #ffffff;
        --color-hover: #f1f5f9;

        /* === TOUCH (Mobile-First: 48px para acessibilidade) === */
        --touch-min: 48px;
        --touch-icon: 44px;

        /* === TRANSIÇÃO === */
        --ease: 200ms cubic-bezier(0.4, 0, 0.2, 1);

        /* === Z === */
        --z-dropdown: 10;
        --z-sticky: 20;
        --z-modal-bg: 40;
        --z-modal: 50;
    }

    /* Containers */
    .container-mobile {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding-left: var(--space-4);
        padding-right: var(--space-4);
    }

    /* Cards: elevação com sombras dinâmicas */
    .surface {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
    }

    .surface-shadow {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-elevated);
    }

    /* Header com gradiente operacional */
    .header-gradient {
        background: var(--gradient-header);
        box-shadow: var(--shadow-elevated);
    }

    /* Superfície sólida (alternativa a glass - sem transparência) */
    .surface-glass {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
    }

    /* Container de ícone: neutro */
    .icon-wrap {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        background: var(--color-border-light);
        color: var(--color-icon);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-wrap-sm {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: var(--color-border-light);
        color: var(--color-icon);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Tipografia */
    .text-title {
        font-size: var(--text-title);
        font-weight: var(--font-semibold);
        color: var(--color-text);
        line-height: var(--leading-tight);
    }

    .text-title-lg {
        font-size: var(--text-title-lg);
        font-weight: var(--font-semibold);
        color: var(--color-text);
        line-height: var(--leading-tight);
    }

    .text-section {
        font-size: var(--text-section);
        font-weight: var(--font-semibold);
        color: var(--color-text);
    }

    .text-body {
        font-size: var(--text-body);
        font-weight: var(--font-normal);
        color: var(--color-text-secondary);
        line-height: var(--leading-normal);
    }

    .text-body-lg {
        font-size: var(--text-body-lg);
        color: var(--color-text-secondary);
    }

    .text-caption {
        font-size: var(--text-caption);
        color: var(--color-text-muted);
    }

    .text-caption-lg {
        font-size: var(--text-caption-lg);
        color: var(--color-text-muted);
    }

    /* Touch targets */
    .touch-target {
        min-width: var(--touch-min);
        min-height: var(--touch-min);
    }

    .touch-target-icon {
        min-width: var(--touch-icon);
        min-height: var(--touch-icon);
    }

    /* Interação - feedback tátil scale 0.95 */
    .interactive {
        transition: transform 0.15s ease, background-color var(--ease);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .interactive:active {
        transform: scale(0.95);
    }

    .disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    /* === ANIMAÇÕES PWA === */
    @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }
    @keyframes bounce-short {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    @keyframes xp-shine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
    .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
    .animate-bounce-short { animation: bounce-short 0.4s ease-out; }
    .animate-xp-shine { animation: xp-shine 1.5s ease-in-out; }
</style>
