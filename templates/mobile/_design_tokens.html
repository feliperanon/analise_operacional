<!-- 
DESIGN TOKENS - Mobile Design System
Operacional Clean & Functional

Este arquivo define os tokens de design para o app mobile.
Usado via CSS custom properties para consistência.
-->

<style>
    :root {
        /* === CORES BASE === */
        --color-background: #ffffff;
        --color-surface: #ffffff;
        --color-surface-secondary: #f8fafc;
        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;
        
        /* === TEXTO === */
        --color-text-primary: #1e3a8a;      /* blue-900 */
        --color-text-secondary: #64748b;    /* slate-500 */
        --color-text-muted: #94a3b8;        /* slate-400 */
        --color-text-inverse: #ffffff;
        
        /* === BRAND === */
        --color-primary: #1e3a8a;           /* blue-900 */
        --color-primary-light: #3b82f6;     /* blue-500 */
        --color-primary-bg: #eff6ff;        /* blue-50 */
        --color-primary-border: #dbeafe;    /* blue-100 */
        
        /* === ESTADOS === */
        --color-success: #10b981;
        --color-success-bg: #ecfdf5;
        --color-success-border: #a7f3d0;
        
        --color-warning: #f59e0b;
        --color-warning-bg: #fffbeb;
        --color-warning-border: #fde68a;
        
        --color-danger: #ef4444;
        --color-danger-bg: #fef2f2;
        --color-danger-border: #fecaca;
        
        --color-info: #3b82f6;
        --color-info-bg: #eff6ff;
        --color-info-border: #dbeafe;
        
        /* === TIPOGRAFIA === */
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-family-mono: ui-monospace, monospace;
        
        /* Escala de tamanhos */
        --text-xs: 0.75rem;      /* 12px */
        --text-sm: 0.875rem;     /* 14px */
        --text-base: 1rem;       /* 16px */
        --text-lg: 1.125rem;     /* 18px */
        --text-xl: 1.25rem;      /* 20px */
        --text-2xl: 1.5rem;      /* 24px */
        
        /* Pesos */
        --font-normal: 400;
        --font-medium: 500;
        --font-semibold: 600;
        --font-bold: 700;
        
        /* Line heights */
        --leading-tight: 1.25;
        --leading-normal: 1.5;
        --leading-relaxed: 1.75;
        
        /* === ESPAÇAMENTO (Grid de 4px) === */
        --space-1: 0.25rem;   /* 4px */
        --space-2: 0.5rem;    /* 8px */
        --space-3: 0.75rem;   /* 12px */
        --space-4: 1rem;      /* 16px */
        --space-5: 1.25rem;   /* 20px */
        --space-6: 1.5rem;    /* 24px */
        --space-8: 2rem;      /* 32px */
        --space-10: 2.5rem;   /* 40px */
        --space-12: 3rem;     /* 48px */
        
        /* === BORDAS === */
        --radius-sm: 0.5rem;     /* 8px */
        --radius-md: 0.75rem;    /* 12px */
        --radius-lg: 1rem;       /* 16px */
        --radius-xl: 1.25rem;    /* 20px */
        --radius-full: 9999px;
        
        --border-width: 1px;
        --border-width-2: 2px;
        
        /* === SOMBRAS === */
        --shadow-sm: 0 1px 2px rgba(30, 58, 138, 0.05);
        --shadow-md: 0 2px 4px rgba(30, 58, 138, 0.08);
        --shadow-lg: 0 4px 8px rgba(30, 58, 138, 0.1);
        
        /* === TOUCH TARGETS === */
        --touch-target-min: 44px;
        --touch-target-icon: 40px;
        
        /* === TRANSIÇÕES === */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        
        /* === Z-INDEX === */
        --z-base: 1;
        --z-dropdown: 10;
        --z-sticky: 20;
        --z-fixed: 30;
        --z-modal-backdrop: 40;
        --z-modal: 50;
        --z-toast: 60;
    }
    
    /* === CLASSES UTILITÁRIAS BASE === */
    
    /* Containers */
    .container-mobile {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding-left: var(--space-6);
        padding-right: var(--space-6);
    }
    
    /* Superfícies */
    .surface {
        background: var(--color-surface);
        border: var(--border-width) solid var(--color-border);
        border-radius: var(--radius-lg);
    }
    
    .surface-secondary {
        background: var(--color-surface-secondary);
    }
    
    /* Tipografia */
    .text-title {
        font-size: var(--text-xl);
        font-weight: var(--font-bold);
        color: var(--color-text-primary);
        line-height: var(--leading-tight);
    }
    
    .text-section {
        font-size: var(--text-lg);
        font-weight: var(--font-semibold);
        color: var(--color-text-primary);
        line-height: var(--leading-tight);
    }
    
    .text-label {
        font-size: var(--text-sm);
        font-weight: var(--font-medium);
        color: var(--color-text-primary);
    }
    
    .text-body {
        font-size: var(--text-base);
        font-weight: var(--font-normal);
        color: var(--color-text-secondary);
        line-height: var(--leading-normal);
    }
    
    .text-caption {
        font-size: var(--text-xs);
        font-weight: var(--font-normal);
        color: var(--color-text-muted);
        line-height: var(--leading-normal);
    }
    
    /* Touch targets mínimos */
    .touch-target {
        min-width: var(--touch-target-min);
        min-height: var(--touch-target-min);
    }
    
    .touch-target-icon {
        min-width: var(--touch-target-icon);
        min-height: var(--touch-target-icon);
    }
    
    /* Estados de interação */
    .interactive {
        transition: all var(--transition-base);
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    
    .interactive:active {
        transform: scale(0.98);
    }
    
    /* Feedback visual */
    .loading {
        opacity: 0.6;
        pointer-events: none;
    }
    
    .disabled {
        opacity: 0.5;
        pointer-events: none;
        cursor: not-allowed;
    }
</style>
