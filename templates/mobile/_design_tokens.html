<!--
DESIGN TOKENS - Tech-Steel Operational v3.0 | Souza Pinto
Dark Mode Futurista, alto contraste, legibilidade sob luz solar.
-->

<style>
    :root {
        /* === PALETA TECH-STEEL (Dark Mode Futurista) === */
        --color-bg: #020617;
        --color-surface: rgba(15, 23, 42, 0.6);
        --color-surface-solid: #0f172a;
        --color-border: #1e293b;
        --color-border-light: #334155;

        --color-text: #ffffff;
        --color-text-body: #cbd5e1;
        --color-text-secondary: #94a3b8;
        --color-text-muted: #64748b;

        --color-icon: #94a3b8;

        --color-primary: #3b82f6;
        --color-primary-bg: rgba(59, 130, 246, 0.15);
        --color-primary-border: rgba(59, 130, 246, 0.4);

        --color-success: #10b981;
        --color-success-neon: 0 0 12px rgba(16, 185, 129, 0.5);
        --color-success-bg: rgba(16, 185, 129, 0.12);
        --color-danger: #ef4444;
        --color-danger-pulse: 0 0 12px rgba(239, 68, 68, 0.5);
        --color-danger-bg: rgba(239, 68, 68, 0.12);
        --color-warning: #f59e0b;
        --color-warning-bg: rgba(245, 158, 11, 0.15);

        /* === GLOW BORDERS (Status) === */
        --glow-ok: 0 0 0 1px #10b981, 0 0 12px rgba(16, 185, 129, 0.3);
        --glow-fail: 0 0 0 1px #ef4444, 0 0 12px rgba(239, 68, 68, 0.3);
        --glow-pending: 0 0 0 1px #f59e0b, 0 0 12px rgba(245, 158, 11, 0.3);

        /* === CARDS (vidro fosco, sem overlay sobre texto) === */
        --card-bg: rgba(15, 23, 42, 0.6);
        --card-border: 1px solid #1e293b;

        /* === SOMBRAS === */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-modal: 0 24px 48px rgba(0, 0, 0, 0.6);

        /* === GRADIENTES === */
        --gradient-header: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --gradient-fade-bottom: linear-gradient(to top, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 0.6) 40%, transparent 100%);
        --gradient-btn-neon: linear-gradient(135deg, #10b981 0%, #059669 100%);

        /* === TIPOGRAFIA === */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', 'Roboto Mono', ui-monospace, monospace;

        --text-caption: 0.6875rem;
        --text-caption-lg: 0.75rem;
        --text-body: 0.8125rem;
        --text-body-lg: 0.875rem;
        --text-section: 0.875rem;
        --text-section-lg: 1rem;
        --text-title: 1rem;
        --text-title-lg: 1.125rem;

        --font-normal: 400;
        --font-medium: 500;
        --font-semibold: 600;

        --leading-tight: 1.25;
        --leading-normal: 1.5;

        /* === ESPAÇAMENTO === */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;

        /* === BORDAS === */
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.25rem;

        /* === TOUCH === */
        --touch-min: 48px;
        --touch-icon: 44px;

        /* === Z === */
        --z-dropdown: 10;
        --z-sticky: 20;
        --z-modal: 9999;
    }

    .container-mobile {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding-left: var(--space-4);
        padding-right: var(--space-4);
    }

    /* Cards Tech-Steel */
    .surface {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: var(--card-border);
        border-radius: var(--radius-lg);
    }

    .surface-shadow {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: var(--card-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
    }

    /* Action Tile (checklist) */
    .action-tile {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        transition: box-shadow 0.2s, border-color 0.2s;
    }
    .action-tile.status-ok { border-color: #10b981; box-shadow: var(--glow-ok); }
    .action-tile.status-fail { border-color: #ef4444; box-shadow: var(--glow-fail); }
    .action-tile.status-pending { border-color: var(--color-border); }

    .icon-wrap {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        background: rgba(30, 41, 59, 0.8);
        color: var(--color-icon);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-wrap-sm {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
    }

    /* Tipografia */
    .text-title { font-size: var(--text-title); font-weight: var(--font-semibold); color: var(--color-text); }
    .text-title-lg { font-size: var(--text-title-lg); font-weight: var(--font-semibold); color: var(--color-text); }
    .text-section { font-size: var(--text-section); font-weight: var(--font-semibold); color: var(--color-text); }
    .text-body { font-size: var(--text-body); color: var(--color-text-body); line-height: var(--leading-normal); }
    .text-body-lg { font-size: var(--text-body-lg); color: var(--color-text-body); }
    .text-caption { font-size: var(--text-caption); color: var(--color-text-muted); }
    .text-caption-lg { font-size: var(--text-caption-lg); color: var(--color-text-muted); }
    .font-mono { font-family: var(--font-mono); }

    .touch-target { min-width: var(--touch-min); min-height: var(--touch-min); }
    .touch-target-icon { min-width: var(--touch-icon); min-height: var(--touch-icon); }

    .interactive {
        transition: transform 0.15s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .interactive:active { transform: scale(0.97); }

    /* Botão Concluir Flutuante */
    .btn-float-conclude {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: var(--space-4);
        padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0));
        background: var(--gradient-fade-bottom);
        z-index: 50;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Lucide stroke mais visível (2.5px) */
    .lucide-thick, .lucide-thick svg, [class*="lucide"].lucide-thick { stroke-width: 2.5; }
</style>
