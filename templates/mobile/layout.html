<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="{{ url_for('static', path='manifest.json') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="light">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='logo-souza-pinto.png') }}?v=20260302">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='logo-souza-pinto.png') }}?v=20260302">
    <title>{% block title %}Portal do Colaborador{% endblock %}</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/styles.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/mobile.css') }}?v=10.0">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

    <!-- Design Tokens -->
    {% include 'mobile/_design_tokens.html' %}

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

    {% block head_extra %}{% endblock %}
</head>

<body class="bg-white text-slate-900 antialiased">
    <div class="flex flex-col min-h-screen">
        <!-- Header (não exibir no login) -->
        {% if not hide_header %}
        {% include 'mobile/_app_header.html' %}
        {% endif %}

        <!-- Main Content -->
        <main class="flex-1 pb-safe">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Lucide Icons Init -->
    <script>
        lucide.createIcons();
        
        // Navegação helper
        function getBackUrl() {
            const path = window.location.pathname;
            const backRoutes = {
                '/mobile/equipment/tickets/new': '/mobile/equipment/tickets',
                '/mobile/equipment/tickets': '/mobile/dashboard',
                '/mobile/routine/checklist': '/mobile/dashboard',
                '/mobile/routine/history': '/mobile/routine/checklist',
                '/mobile/achievements': '/mobile/dashboard',
                '/mobile/game': '/mobile/dashboard'
            };
            
            if (path.includes('/mobile/equipment/tickets/') && path !== '/mobile/equipment/tickets') {
                const referrer = document.referrer;
                if (referrer.includes('/mobile/equipment/tickets/new')) {
                    return '/mobile/equipment/tickets/new';
                }
                return '/mobile/equipment/tickets';
            }
            
            return backRoutes[path] || '/mobile/dashboard';
        }
        
        window.getBackUrl = getBackUrl;
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
