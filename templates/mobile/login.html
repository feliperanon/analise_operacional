{% extends "mobile/layout.html" %}
{% from 'mobile/_components.html' import button_primary, input %}

{% set hide_header = true %}

{% block content %}
<div class="container-mobile flex flex-col items-center justify-center min-h-[80vh] py-12">
    
    <!-- Logo Souza Pinto -->
    <div class="mb-10 text-center">
        <img src="{{ url_for('static', path='logo-souza-pinto.png') }}?v=20260302" alt="Souza Pinto" class="w-56 h-auto mx-auto mb-3">
        <p class="text-body" style="color: var(--color-text-secondary);">Acesso operacional</p>
    </div>

    <div class="w-full max-w-sm">
        <div class="surface p-6" style="box-shadow: var(--shadow-card);">
            {% if error %}
            <div class="mb-5 p-4 rounded-lg flex items-start gap-3" style="background: var(--color-danger-bg); border: 1px solid var(--color-danger);">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5" style="color: var(--color-danger);"></i>
                <p class="text-body font-medium" style="color: var(--color-danger);">{{ error }}</p>
            </div>
            {% endif %}

            <form action="/mobile/auth" method="POST" class="space-y-5">
                <div class="space-y-1.5">
                    <label for="registration_id" class="block text-section" style="color: var(--color-text);">Matrícula</label>
                    <input type="text" id="registration_id" name="registration_id" placeholder="Digite sua matrícula" required autofocus
                        class="w-full px-4 py-3 rounded-lg border-2 text-body-lg focus:outline-none focus:ring-2 transition-colors"
                        style="background: var(--color-surface); border-color: var(--color-border); color: var(--color-text);">
                </div>
                <button type="submit"
                    class="w-full touch-target flex items-center justify-center gap-2 px-5 py-3.5 rounded-lg font-semibold text-body-lg text-white transition-opacity"
                    style="background: var(--color-primary);">
                    <span>Entrar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
        <div class="mt-8 text-center space-y-1">
            <p class="text-caption">&copy; 2026 Souza Pinto Distribuidora</p>
            <p class="text-caption" style="color: var(--color-text-muted);">Portal Operacional</p>
        </div>
    </div>
</div>

<script>
    // Auto-focus no input e criar ícones
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        const input = document.getElementById('registration_id');
        if (input) {
            input.focus();
            // Selecionar texto se houver valor prévio
            if (input.value) input.select();
        }
    });
</script>
{% endblock %}
