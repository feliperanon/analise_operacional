{% extends "mobile/layout.html" %}

{% block content %}
<div class="min-h-[85vh] flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decor (Optional glow) -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-blue-500/20 rounded-full blur-[100px] pointer-events-none">
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-sm relative z-10 animate-fade-in-up">

        <!-- Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 shadow-lg shadow-blue-500/30 mb-4 transform -rotate-3">
                <i data-lucide="scan-barcode" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Smart Flow</h1>
            <p class="text-slate-400 mt-2 text-sm font-medium">Acesso Operacional</p>
        </div>

        <!-- Glass Card -->
        <div class="backdrop-blur-xl bg-slate-800/40 border border-slate-700/50 p-8 rounded-3xl shadow-2xl">

            {% if error %}
            <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 flex items-start gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 shrink-0 mt-0.5"></i>
                <p class="text-sm text-red-200">{{ error }}</p>
            </div>
            {% endif %}

            <form action="/mobile/auth" method="POST" class="space-y-6">

                <div class="space-y-2">
                    <label for="registration_id"
                        class="text-xs font-bold text-blue-400 uppercase tracking-widest pl-1">Sua Matrícula</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-blue-500 transition-colors">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="registration_id" name="registration_id"
                            class="block w-full pl-12 pr-4 py-4 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all text-center text-lg font-mono tracking-widest"
                            placeholder="123456" required inputmode="numeric" autofocus autocomplete="off">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold text-lg shadow-lg shadow-blue-900/40 transform active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    <span>Entrar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>

            </form>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-xs text-slate-500">
            <p>&copy; 2026 Análise Operacional</p>
            <p class="mt-1 opacity-50">v5.4 Mobile</p>
        </div>

    </div>
</div>

<style>
    /* Custom animation for smoother entry */
    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
    }

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
