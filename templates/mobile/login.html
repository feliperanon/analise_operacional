{% extends "mobile/layout.html" %}
{% from 'mobile/_components.html' import button_primary, input %}

{% set hide_header = true %}

{% block content %}
<div class="min-h-screen" style="background: radial-gradient(1200px 500px at 50% -15%, rgba(44, 94, 172, 0.35), transparent 60%), #112434;">
    <div class="container-mobile flex flex-col items-center justify-center min-h-screen py-12">

        <div class="mb-8 text-center">
            <img src="{{ url_for('static', path='logo-souza-pinto-login.jpg') }}?v=20260306" alt="Souza Pinto" class="w-72 max-w-full h-auto mx-auto mb-3 rounded-xl drop-shadow-[0_8px_20px_rgba(0,0,0,0.35)]">
            <p class="text-body" style="color: rgba(226, 232, 240, 0.95);">Acesso operacional</p>
        </div>

        <div class="w-full max-w-sm">
            <div class="surface p-6" style="box-shadow: var(--shadow-card); background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(148, 163, 184, 0.3); backdrop-filter: blur(10px);">
                {% if error %}
                <div class="mb-5 p-4 rounded-lg flex items-start gap-3" style="background: var(--color-danger-bg); border: 1px solid var(--color-danger);">
                    <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5" style="color: var(--color-danger);"></i>
                    <p class="text-body font-medium" style="color: var(--color-danger);">{{ error }}</p>
                </div>
                {% endif %}

                <form action="/mobile/auth" method="POST" class="space-y-5">
                    <div class="space-y-1.5">
                        <label for="registration_id" class="block text-section" style="color: #e2e8f0;">Matrícula</label>
                        <input type="text" id="registration_id" name="registration_id" placeholder="Digite sua matrícula" required autofocus
                            class="w-full px-4 py-3 rounded-lg border-2 text-body-lg focus:outline-none focus:ring-2 transition-colors"
                            style="background: rgba(15, 23, 42, 0.85); border-color: rgba(148, 163, 184, 0.35); color: #f8fafc;">
                    </div>
                    <button type="submit"
                        class="w-full touch-target flex items-center justify-center gap-2 px-5 py-3.5 rounded-lg font-semibold text-body-lg text-white transition-opacity"
                        style="background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);">
                        <span>Entrar</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>
            <div class="mt-8 text-center space-y-1">
                <p class="text-caption" style="color: rgba(226, 232, 240, 0.95);">&copy; 2026 Souza Pinto Distribuidora</p>
                <p class="text-caption" style="color: rgba(148, 163, 184, 0.95);">Portal Operacional</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        const input = document.getElementById('registration_id');
        if (input) {
            input.focus();
            if (input.value) input.select();
        }
    });
</script>
{% endblock %}
