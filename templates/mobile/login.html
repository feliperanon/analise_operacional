{% extends "mobile/layout.html" %}

{% block content %}
<div class="min-h-[85vh] flex flex-col items-center justify-center p-6 relative">

    <!-- Main Card -->
    <div class="w-full max-w-sm relative z-10 animate-fade-in-up">

        <!-- Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-600 shadow-minimal-lg mb-6">
                <i data-lucide="scan-barcode" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight logo-text">Portal</h1>
            <p class="text-slate-600 mt-2 text-sm font-medium">Acesso Operacional</p>
        </div>

        <!-- Card -->
        <div class="bg-white border-2 border-slate-200 p-8 rounded-3xl shadow-minimal-lg">

            {% if error %}
            <div class="mb-6 p-4 rounded-2xl bg-red-50 border-2 border-red-200 flex items-start gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 shrink-0 mt-0.5"></i>
                <p class="text-sm text-red-700 font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form action="/mobile/auth" method="POST" class="space-y-6">

                <div class="space-y-2">
                    <label for="registration_id"
                        class="text-xs font-bold text-blue-600 uppercase tracking-widest pl-1">Sua Matrícula</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-600 transition-colors">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="registration_id" name="registration_id"
                            class="block w-full pl-12 pr-4 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 focus:outline-none transition-all text-center text-lg font-mono tracking-widest"
                            placeholder="123456" required inputmode="numeric" autofocus autocomplete="off">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-2xl font-bold text-lg shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    <span>Entrar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>

            </form>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-xs text-slate-500">
            <p>&copy; 2026 Análise Operacional</p>
            <p class="mt-1 opacity-70">v6.0 Mobile · Design Minimalista</p>
        </div>

    </div>
</div>

<style>
    /* Custom animation for smoother entry */
    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
    }

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
