{% extends "mobile/layout.html" %}
{% from 'mobile/_components.html' import button_primary, input %}

{% set hide_header = true %}

{% block content %}
<div class="container-mobile flex flex-col items-center justify-center min-h-[80vh] py-12">
    
    <!-- Logo Souza Pinto -->
    <div class="mb-12 text-center">
        <img src="{{ url_for('static', path='logo-souza-pinto.png') }}?v=20260302" 
             alt="Souza Pinto Distribuidora" 
             class="w-72 h-auto mx-auto mb-4">
        <p class="text-sm text-slate-600">Acesso Operacional</p>
    </div>

    <!-- Login Form -->
    <div class="w-full max-w-sm">
        <div class="surface p-6 shadow-xl">
            
            {% if error %}
            <div class="mb-5 p-4 rounded-lg bg-red-50 border-2 border-red-200 flex items-start gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></i>
                <p class="text-sm text-red-900 font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form action="/mobile/auth" method="POST" class="space-y-6">
                <!-- Input de Matrícula -->
                <div class="space-y-2">
                    <label for="registration_id" class="block text-sm font-semibold text-blue-900">
                        Matrícula
                    </label>
                    <input 
                        type="text" 
                        id="registration_id" 
                        name="registration_id" 
                        placeholder="Digite sua matrícula" 
                        required
                        autofocus
                        class="w-full px-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-blue-900 text-base placeholder-slate-400 focus:border-blue-900 focus:ring-4 focus:ring-blue-100 focus:outline-none transition-all font-medium">
                </div>
                
                <!-- Botão de Login -->
                <button 
                    type="submit"
                    class="w-full touch-target flex items-center justify-center gap-2 px-6 py-4 bg-green-600 text-white rounded-xl font-bold text-base hover:bg-green-700 active:scale-[0.98] transition-all shadow-lg shadow-green-600/25">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center space-y-1">
            <p class="text-xs text-slate-500">&copy; 2026 Souza Pinto Distribuidora</p>
            <p class="text-xs text-slate-400">Portal Operacional v6.0</p>
        </div>
    </div>
</div>

<script>
    // Auto-focus no input e criar ícones
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        const input = document.getElementById('registration_id');
        if (input) {
            input.focus();
            // Selecionar texto se houver valor prévio
            if (input.value) input.select();
        }
    });
</script>
{% endblock %}
