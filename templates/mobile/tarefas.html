{% extends "mobile/layout.html" %}

{% block title %}Minhas Tarefas{% endblock %}

{% block content %}
<div class="relative z-10 px-5 pb-24">
    <div class="flex items-center gap-3 mb-6">
        <a href="/mobile/dashboard" class="w-10 h-10 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center text-white active:scale-95">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-xl font-bold text-white">Minhas Tarefas</h1>
            <p class="text-sm text-slate-400">Tarefas enviadas pelo seu líder</p>
        </div>
    </div>

    <div id="tarefas-list" class="space-y-4">
        <div id="tarefas-loading" class="text-center py-8 text-slate-400">
            <i data-lucide="loader" class="w-8 h-8 animate-spin inline-block"></i>
            <p class="mt-2 text-sm">Carregando...</p>
        </div>
        <div id="tarefas-empty" class="hidden text-center py-12 text-slate-400">
            <i data-lucide="list-todo" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
            <p class="text-sm">Nenhuma tarefa no momento.</p>
        </div>
        <div id="tarefas-cards" class="hidden space-y-4"></div>
    </div>
</div>

<script>
(function() {
    function renderTasks(tasks) {
        var loading = document.getElementById('tarefas-loading');
        var empty = document.getElementById('tarefas-empty');
        var cards = document.getElementById('tarefas-cards');
        loading.classList.add('hidden');
        if (!tasks || tasks.length === 0) {
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');
        cards.classList.remove('hidden');
        cards.innerHTML = tasks.map(function(t) {
            var priorClass = t.priority === 'high' ? 'border-rose-500/50 bg-rose-500/5' : (t.priority === 'low' ? 'border-slate-600 bg-slate-800/50' : 'border-amber-500/30 bg-amber-500/5');
            var desc = t.description ? '<p class="text-sm text-slate-400 mt-1">' + escapeHtml(t.description) + '</p>' : '';
            var due = t.due_at ? '<p class="text-xs text-slate-500 mt-1">Prazo: ' + formatDate(t.due_at) + '</p>' : '';
            return '<div class="rounded-2xl border p-4 ' + priorClass + '" data-task-id="' + t.id + '">' +
                '<div class="flex items-start justify-between gap-2">' +
                '<h3 class="font-bold text-white">' + escapeHtml(t.title) + '</h3>' +
                (t.priority === 'high' ? '<span class="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded shrink-0">Alta</span>' : '') +
                '</div>' + desc + due +
                '<div class="flex gap-2 mt-3">' +
                '<button type="button" onclick="marcarVisto(' + t.id + ')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600">Marcar visto</button>' +
                '<button type="button" onclick="concluirTarefa(' + t.id + ')" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-500">Concluir</button>' +
                '</div></div>';
        }).join('');
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
    }
    function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }
    function formatDate(iso) {
        try {
            var d = new Date(iso);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        } catch (e) { return iso; }
    }
    window.marcarVisto = function(taskId) {
        fetch('/api/lider/tarefas/' + taskId + '/marcar-visto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
            .then(function(r) { return r.json(); })
            .then(function(data) { if (data.success) loadTasks(); });
    };
    window.concluirTarefa = function(taskId) {
        fetch('/api/lider/tarefas/' + taskId + '/concluir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
            .then(function(r) { return r.json(); })
            .then(function(data) { if (data.success) loadTasks(); });
    };
    function loadTasks() {
        fetch('/api/lider/minhas-tarefas')
            .then(function(r) { return r.json(); })
            .then(function(data) { renderTasks(Array.isArray(data) ? data : []); })
            .catch(function() { renderTasks([]); });
    }
    loadTasks();
})();
</script>
{% endblock %}
