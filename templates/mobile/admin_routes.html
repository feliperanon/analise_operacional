{% extends "mobile/layout.html" %}

{% block title %}Rotas do Dia{% endblock %}

{% block content %}
<div class="min-h-screen pb-safe" style="background: var(--color-bg);" x-data="routeManager()">
    <header class="container-mobile py-4 border-b shrink-0 relative z-20" style="border-color: var(--color-border-light); background: var(--color-surface);">
        <div class="flex items-center justify-between">
            <a href="/mobile/dashboard" class="touch-target-icon flex items-center justify-center rounded-lg icon-wrap">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-3">
                <div class="icon-wrap w-10 h-10 flex items-center justify-center" style="background: var(--color-primary); color: white;">
                    <i data-lucide="route" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-title-lg" style="color: var(--color-text);">Rotas do Dia</h1>
                    <p class="text-caption-lg">Motoristas, ajudantes e situação</p>
                </div>
            </div>
            <button @click="loadRoutes()" class="touch-target-icon flex items-center justify-center rounded-lg icon-wrap">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <div x-show="isLoading" class="flex items-center justify-center py-20">
        <div class="w-10 h-10 border-2 rounded-full animate-spin" style="border-color: var(--color-border); border-top-color: var(--color-primary);"></div>
    </div>

    <div x-show="!isLoading" class="container-mobile py-4 space-y-6">
        <div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-title flex items-center gap-2" style="color: var(--color-text);">
                    <div class="icon-wrap w-8 h-8 flex items-center justify-center" style="background: var(--color-success-bg); color: var(--color-success);">
                        <i data-lucide="truck" class="w-4 h-4"></i>
                    </div>
                    Rotas
                </h2>
                <span class="text-caption font-bold px-3 py-1 rounded-full" style="background: var(--color-primary-bg); color: var(--color-primary);" x-text="liveSeparation.length"></span>
            </div>

            <template x-if="liveSeparation.length === 0">
                <div class="surface p-8 text-center">
                    <div class="icon-wrap w-14 h-14 rounded-full mx-auto mb-3"><i data-lucide="inbox" class="w-7 h-7"></i></div>
                    <p class="text-body" style="color: var(--color-text-secondary);">Nenhuma rota no momento</p>
                </div>
            </template>

            <div class="space-y-3">
                <template x-for="card in liveSeparation" :key="card.employee_id">
                    <div class="surface overflow-hidden rounded-xl" :class="statusCardClass(card)">
                        <div class="p-4 flex items-start gap-3">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 font-bold text-body" style="background: var(--color-border-light); color: var(--color-text);" x-text="(card.employee_name || '?')[0]"></div>
                            <div class="min-w-0 flex-1">
                                <p class="text-body font-bold truncate" style="color: var(--color-text);" x-text="card.employee_name"></p>
                                <p class="text-caption truncate mt-0.5" style="color: var(--color-text-muted);">
                                    Ajud.: <span x-text="(card.helper_names || []).join(', ') || '—'"></span>
                                    <span class="mx-1">·</span>
                                    Placa: <span x-text="card.plate || '—'"></span>
                                    <span class="mx-1">·</span>
                                    <span x-text="(card.total_kg || 0) + ' kg'"></span>
                                </p>
                                <div class="flex items-center gap-2 mt-2 flex-wrap">
                                    <span class="text-caption font-semibold" style="color: var(--color-text-muted);" x-text="(card.completed_deliveries || 0) + '/' + (card.total_deliveries || 0) + ' entregas'"></span>
                                    <span class="text-caption font-bold px-2 py-0.5 rounded" :class="statusBadgeClass(card)" x-text="statusLabel(card)"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-title flex items-center gap-2" style="color: var(--color-text);">
                    <div class="icon-wrap w-8 h-8 flex items-center justify-center" style="background: var(--color-warning-bg); color: var(--color-warning);">
                        <i data-lucide="user-x" class="w-4 h-4"></i>
                    </div>
                    Sem Rota
                </h2>
                <span class="text-caption font-bold px-3 py-1 rounded-full" style="background: var(--color-warning-bg); color: var(--color-warning);" x-text="employeesWithoutRoute.length"></span>
            </div>

            <template x-if="employeesWithoutRoute.length === 0">
                <div class="surface p-6 text-center">
                    <p class="text-body" style="color: var(--color-text-secondary);">Todos os colaboradores possuem rota ativa</p>
                </div>
            </template>

            <div class="space-y-2">
                <template x-for="emp in employeesWithoutRoute" :key="emp.id">
                    <div class="surface p-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-caption font-semibold px-2 py-1 rounded" style="background: var(--color-primary-bg); color: var(--color-primary);" x-text="emp.registration_id"></span>
                            <span class="text-body font-medium" style="color: var(--color-text);" x-text="emp.name"></span>
                        </div>
                        <span class="text-caption" style="color: var(--color-text-muted);" x-text="emp.shift"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
    function routeManager() {
        return {
            isLoading: true,
            liveSeparation: [],
            employeesWithoutRoute: [],

            init() { this.loadRoutes(); this.$nextTick(() => lucide.createIcons()); },

            async loadRoutes() {
                this.isLoading = true;
                try {
                    const res = await fetch('/api/mobile/admin/routes');
                    const data = await res.json();
                    if (data.success) {
                        this.liveSeparation = data.live_separation || [];
                        this.employeesWithoutRoute = data.employees_without_route || [];
                    } else {
                        alert('Erro: ' + (data.error || ''));
                    }
                } catch (e) {
                    alert('Erro de conexão');
                } finally {
                    this.isLoading = false;
                    this.$nextTick(() => lucide.createIcons());
                }
            },

            statusLabel(card) {
                const st = card.route_state || '';
                if (st === 'closed') return 'Encerrada';
                if (st === 'not_started') return 'Rota parada';
                if (st === 'route_started') return 'Início';
                if (st === 'all_delivered') return 'Entregues';
                const total = card.total_deliveries || 0;
                const completed = card.completed_deliveries || 0;
                const openCount = total - completed;
                const pct = total ? (completed / total * 100) : 0;
                if (openCount >= 5 || pct < 25) return 'Crítico';
                if (openCount >= 3 || pct < 50) return 'Atenção';
                return 'Normal';
            },

            statusBadgeClass(card) {
                const st = card.route_state || '';
                if (st === 'closed') return 'bg-emerald-500/30 text-emerald-200';
                if (st === 'not_started') return 'bg-slate-600/50 text-slate-400';
                if (st === 'route_started') return 'bg-sky-500/25 text-sky-300';
                if (st === 'all_delivered') return 'bg-violet-500/35 text-violet-200';
                const total = card.total_deliveries || 0;
                const completed = card.completed_deliveries || 0;
                const openCount = total - completed;
                const pct = total ? (completed / total * 100) : 0;
                if (openCount >= 5 || pct < 25) return 'bg-red-500/20 text-red-300';
                if (openCount >= 3 || pct < 50) return 'bg-amber-500/25 text-amber-300';
                return 'bg-slate-600/50 text-slate-400';
            },

            statusCardClass(card) {
                const st = card.route_state || '';
                if (st === 'closed') return 'border-emerald-500/50';
                if (st === 'not_started') return 'border-slate-500/60';
                if (st === 'route_started') return 'border-sky-500/50';
                if (st === 'all_delivered') return 'border-violet-500/50';
                const total = card.total_deliveries || 0;
                const completed = card.completed_deliveries || 0;
                const openCount = total - completed;
                const pct = total ? (completed / total * 100) : 0;
                if (openCount >= 5 || pct < 25) return 'border-red-500/50';
                if (openCount >= 3 || pct < 50) return 'border-amber-500/50';
                return 'border-slate-500/40';
            }
        };
    }
</script>
{% endblock %}
