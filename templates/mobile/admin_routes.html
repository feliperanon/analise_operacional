{% extends "mobile/layout.html" %}

{% block title %}Gerenciar Rotas{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 pb-20" x-data="routeManager()">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 shadow-lg">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/mobile/dashboard" class="text-white/80 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <div>
                    <h1 class="text-2xl font-bold">Gerenciar Rotas</h1>
                    <p class="text-sm text-blue-100">Controle de rotas ativas</p>
                </div>
            </div>
            <button @click="loadRoutes()" class="bg-white/20 hover:bg-white/30 p-2 rounded-lg transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="isLoading" class="flex items-center justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div>
    </div>

    <!-- Content -->
    <div x-show="!isLoading" class="p-4 space-y-6">
        <!-- Active Routes Section -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-white flex items-center space-x-2">
                    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Rotas Ativas</span>
                </h2>
                <span class="bg-green-500 text-white px-3 py-1 rounded-full text-sm font-bold"
                    x-text="activeRoutes.length"></span>
            </div>

            <template x-if="activeRoutes.length === 0">
                <div class="bg-slate-800/50 backdrop-blur-sm rounded-xl p-8 text-center border border-slate-700">
                    <svg class="w-16 h-16 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                    </svg>
                    <p class="text-slate-400 text-lg">Nenhuma rota ativa no momento</p>
                </div>
            </template>

            <div class="space-y-4">
                <template x-for="(routes, employeeId) in groupedRoutes" :key="employeeId">
                    <div
                        class="bg-slate-800/90 backdrop-blur-sm rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                        <!-- Header com Colaborador -->
                        <div class="bg-gradient-to-r from-blue-600/20 to-indigo-600/20 border-b border-slate-700 p-4">
                            <h3 class="text-white font-bold text-lg" x-text="routes[0].employee_name"></h3>
                        </div>

                        <!-- Lista de Rotas do Colaborador -->
                        <div class="p-4 space-y-3">
                            <template x-for="route in routes" :key="route.id">
                                <div class="bg-slate-700/30 rounded-xl border border-slate-600/50 overflow-hidden">
                                    <!-- Informações da Rota -->
                                    <div class="p-3 space-y-3">
                                        <!-- Cliente -->
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center space-x-3 flex-1">
                                                <div class="bg-purple-500/20 p-2 rounded-lg">
                                                    <svg class="w-4 h-4 text-purple-400" fill="none"
                                                        stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                                    </svg>
                                                </div>
                                                <div class="flex-1">
                                                    <p class="text-xs text-slate-400 uppercase font-semibold">Cliente
                                                    </p>
                                                    <p class="text-white font-medium" x-text="route.client_name"></p>
                                                </div>
                                            </div>
                                            <div class="flex space-x-2">
                                                <button @click="openEditModal(route)"
                                                    class="bg-blue-500/80 hover:bg-blue-500 text-white p-2 rounded-lg transition-all active:scale-95"
                                                    title="Editar">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                        viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                    </svg>
                                                </button>
                                                <button @click="openDeleteModal(route)"
                                                    class="bg-red-500/80 hover:bg-red-500 text-white p-2 rounded-lg transition-all active:scale-95"
                                                    title="Excluir">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor"
                                                        viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Horário e Tonelagem -->
                                        <div class="grid grid-cols-2 gap-3">
                                            <!-- Horário -->
                                            <div class="flex items-center space-x-2 bg-slate-700/50 rounded-lg p-2">
                                                <div class="bg-yellow-500/20 p-1.5 rounded">
                                                    <svg class="w-4 h-4 text-yellow-400" fill="none"
                                                        stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                </div>
                                                <div class="flex-1">
                                                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Início
                                                    </p>
                                                    <p class="text-white font-mono font-bold text-sm"
                                                        x-text="route.start_time"></p>
                                                </div>
                                            </div>

                                            <!-- Tonelagem -->
                                            <div class="flex items-center space-x-2 bg-slate-700/50 rounded-lg p-2">
                                                <div class="bg-green-500/20 p-1.5 rounded">
                                                    <svg class="w-4 h-4 text-green-400" fill="none"
                                                        stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                                                    </svg>
                                                </div>
                                                <div class="flex-1">
                                                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Peso
                                                    </p>
                                                    <p class="text-white font-bold text-sm"
                                                        x-text="formatTonnage(route.tonnage)"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Employees Without Route Section -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-white flex items-center space-x-2">
                    <svg class="w-6 h-6 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span>Sem Rota</span>
                </h2>
                <span class="bg-orange-500 text-white px-3 py-1 rounded-full text-sm font-bold"
                    x-text="employeesWithoutRoute.length"></span>
            </div>

            <template x-if="employeesWithoutRoute.length === 0">
                <div class="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 text-center border border-slate-700">
                    <p class="text-slate-400">Todos os colaboradores possuem rota ativa</p>
                </div>
            </template>

            <div class="space-y-2">
                <template x-for="emp in employeesWithoutRoute" :key="emp.id">
                    <div
                        class="bg-slate-800/50 backdrop-blur-sm rounded-lg p-3 border border-slate-700 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="bg-orange-500 text-white px-2 py-1 rounded text-xs font-bold"
                                x-text="emp.registration_id"></span>
                            <span class="text-white font-medium" x-text="emp.name"></span>
                        </div>
                        <span class="text-slate-400 text-sm" x-text="emp.shift"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div x-show="showEditModal" @click.away="showEditModal = false"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4"
        style="display: none;">
        <div @click.stop class="bg-slate-800 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 rounded-t-2xl">
                <h3 class="text-xl font-bold">Editar Rota</h3>
            </div>
            <div class="p-6 space-y-4">
                <!-- Employee Select -->
                <div>
                    <label class="block text-white font-medium mb-2">Colaborador</label>
                    <select x-model="editForm.employee_id"
                        class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <template x-for="emp in allEmployees" :key="emp.id">
                            <option :value="emp.id" x-text="`${emp.registration_id} - ${emp.name}`"></option>
                        </template>
                    </select>
                </div>

                <!-- Client Select -->
                <div>
                    <label class="block text-white font-medium mb-2">Cliente</label>
                    <select x-model="editForm.client_id"
                        class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <template x-for="client in allClients" :key="client.id">
                            <option :value="client.id" x-text="client.name"></option>
                        </template>
                    </select>
                </div>

                <!-- Tonnage Input -->
                <div>
                    <label class="block text-white font-medium mb-2">Tonelagem (kg)</label>
                    <input type="number" x-model="editForm.tonnage" step="0.01"
                        class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="0.00">
                </div>

                <!-- Reason Textarea -->
                <div>
                    <label class="block text-white font-medium mb-2">Justificativa *</label>
                    <textarea x-model="editForm.reason" rows="3"
                        class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                        placeholder="Mínimo 5 caracteres"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex space-x-3 pt-4">
                    <button @click="showEditModal = false"
                        class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-lg font-medium transition">
                        Cancelar
                    </button>
                    <button @click="saveEdit()" :disabled="isSubmitting"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition disabled:opacity-50">
                        <span x-show="!isSubmitting">Salvar</span>
                        <span x-show="isSubmitting">Salvando...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div x-show="showDeleteModal" @click.away="showDeleteModal = false"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4"
        style="display: none;">
        <div @click.stop class="bg-slate-800 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700">
            <div class="bg-gradient-to-r from-red-600 to-pink-600 text-white p-6 rounded-t-2xl">
                <h3 class="text-xl font-bold">Excluir Rota</h3>
            </div>
            <div class="p-6 space-y-4">
                <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-4">
                    <p class="text-red-400 font-medium">Atenção: Esta ação não pode ser desfeita!</p>
                </div>

                <div>
                    <p class="text-white mb-2">Rota:</p>
                    <div class="bg-slate-700 rounded-lg p-3 space-y-1 text-sm">
                        <p class="text-white font-medium" x-text="deleteForm.employee_name"></p>
                        <p class="text-slate-300" x-text="deleteForm.client_name"></p>
                    </div>
                </div>

                <!-- Reason Textarea -->
                <div>
                    <label class="block text-white font-medium mb-2">Justificativa *</label>
                    <textarea x-model="deleteForm.reason" rows="3"
                        class="w-full bg-slate-700 text-white border border-slate-600 rounded-lg px-4 py-3 focus:ring-2 focus:ring-red-500 focus:border-transparent resize-none"
                        placeholder="Mínimo 5 caracteres"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex space-x-3 pt-4">
                    <button @click="showDeleteModal = false"
                        class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-lg font-medium transition">
                        Cancelar
                    </button>
                    <button @click="confirmDelete()" :disabled="isSubmitting"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-medium transition disabled:opacity-50">
                        <span x-show="!isSubmitting">Excluir</span>
                        <span x-show="isSubmitting">Excluindo...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function routeManager() {
        return {
            isLoading: true,
            isSubmitting: false,
            activeRoutes: [],
            employeesWithoutRoute: [],
            allClients: [],
            allEmployees: [],
            showEditModal: false,
            showDeleteModal: false,
            editForm: {
                route_id: null,
                employee_id: null,
                client_id: null,
                tonnage: 0,
                reason: ''
            },
            deleteForm: {
                route_id: null,
                employee_name: '',
                client_name: '',
                reason: ''
            },

            get groupedRoutes() {
                // Group routes by employee_id
                const grouped = {};
                this.activeRoutes.forEach(route => {
                    if (!grouped[route.employee_id]) {
                        grouped[route.employee_id] = [];
                    }
                    grouped[route.employee_id].push(route);
                });
                return grouped;
            },

            init() {
                this.loadRoutes();
            },

            async loadRoutes() {
                this.isLoading = true;
                try {
                    const response = await fetch('/api/mobile/admin/routes');
                    const data = await response.json();

                    if (data.success) {
                        this.activeRoutes = data.active_routes;
                        this.employeesWithoutRoute = data.employees_without_route;
                        this.allClients = data.all_clients;
                        this.allEmployees = data.all_employees;
                    } else {
                        alert('Erro ao carregar rotas: ' + (data.error || 'Erro desconhecido'));
                    }
                } catch (error) {
                    console.error('Error loading routes:', error);
                    alert('Erro de conexão ao carregar rotas');
                } finally {
                    this.isLoading = false;
                }
            },

            openEditModal(route) {
                this.editForm = {
                    route_id: route.id,
                    employee_id: route.employee_id,
                    client_id: route.client_id,
                    tonnage: route.tonnage,
                    reason: ''
                };
                this.showEditModal = true;
            },

            async saveEdit() {
                if (!this.editForm.reason || this.editForm.reason.trim().length < 5) {
                    alert('Justificativa obrigatória (mínimo 5 caracteres)');
                    return;
                }

                this.isSubmitting = true;
                try {
                    const response = await fetch(`/api/mobile/admin/routes/${this.editForm.route_id}/edit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            employee_id: parseInt(this.editForm.employee_id),
                            client_id: parseInt(this.editForm.client_id),
                            tonnage: parseFloat(this.editForm.tonnage),
                            reason: this.editForm.reason
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert('Rota editada com sucesso!');
                        this.showEditModal = false;
                        await this.loadRoutes();
                    } else {
                        alert('Erro: ' + (data.error || 'Falha ao editar'));
                    }
                } catch (error) {
                    console.error('Error editing route:', error);
                    alert('Erro de conexão');
                } finally {
                    this.isSubmitting = false;
                }
            },

            openDeleteModal(route) {
                this.deleteForm = {
                    route_id: route.id,
                    employee_name: route.employee_name,
                    client_name: route.client_name,
                    reason: ''
                };
                this.showDeleteModal = true;
            },

            async confirmDelete() {
                if (!this.deleteForm.reason || this.deleteForm.reason.trim().length < 5) {
                    alert('Justificativa obrigatória (mínimo 5 caracteres)');
                    return;
                }

                this.isSubmitting = true;
                try {
                    const response = await fetch(`/api/mobile/admin/routes/${this.deleteForm.route_id}/delete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reason: this.deleteForm.reason
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert('Rota excluída com sucesso!');
                        this.showDeleteModal = false;
                        await this.loadRoutes();
                    } else {
                        alert('Erro: ' + (data.error || 'Falha ao excluir'));
                    }
                } catch (error) {
                    console.error('Error deleting route:', error);
                    alert('Erro de conexão');
                } finally {
                    this.isSubmitting = false;
                }
            },

            formatTonnage(tonnage) {
                return `${parseFloat(tonnage || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} kg`;
            }
        }
    }
</script>
{% endblock %}
