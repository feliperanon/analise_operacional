<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Operação Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center h-screen overflow-hidden relative">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div
            class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-blob">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-blob animation-delay-2000">
        </div>
    </div>

    <div class="w-full max-w-md p-8 rounded-2xl glass shadow-2xl border border-white/10 relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold mb-2 tracking-tight">Recuperar Senha</h1>
            <p class="text-slate-400 text-sm">Informe seu e-mail para gerar o link de redefinição</p>
        </div>

        {% if sent %}
        <div
            class="mb-4 p-3 rounded-lg bg-emerald-500/20 border border-emerald-500/50 text-emerald-200 text-sm">
            Se o e-mail existir, enviaremos um link de redefinição.
        </div>
        {% endif %}

        {% if show_reset_link and reset_link %}
        <div class="mb-4 p-3 rounded-lg bg-slate-800/70 border border-slate-700 text-slate-200 text-sm">
            Link de redefinição (ambiente de teste):
            <div class="mt-2 break-all text-blue-300">{{ reset_link }}</div>
        </div>
        {% endif %}

        <form action="/reset" method="POST" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">E-mail</label>
                <input type="email" name="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800/50 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duraiton-200"
                    placeholder="seuemail@empresa.com">
            </div>

            <button type="submit"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5 transition-all duration-200">
                Gerar Link
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="/login" class="text-slate-400 hover:text-white transition-colors">Voltar para o login</a>
        </div>
    </div>

</body>

</html>
