<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro Interno (500) - Análise Operacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-8 text-center border border-slate-700">
        <div class="mb-6 flex justify-center">
            <div class="p-4 bg-red-500/10 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Ops! Algo deu errado.</h1>
        <p class="text-slate-400 mb-6">
            Ocorreu um erro interno inesperado. Nossa equipe foi notificada automaticamente.
        </p>

        {% if error_detail %}
        <div class="bg-slate-900/50 rounded-lg p-4 mb-6 text-left overflow-x-auto">
            <p class="text-xs text-slate-500 font-mono">Detalhes Técnicos:</p>
            <code class="text-xs text-red-300 font-mono block mt-1 break-words">
                {{ error_detail }}
            </code>
        </div>
        {% endif %}

        <div class="flex gap-4 justify-center">
            <button onclick="window.history.back()"
                class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition text-slate-200">
                Voltar
            </button>
            <a href="/" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition text-white font-medium">
                Ir para o Início
            </a>
        </div>

        <p class="mt-8 text-xs text-slate-500">
            Trace ID: <span class="font-mono text-slate-400">{{ trace_id }}</span>
        </p>
    </div>
</body>

</html>
