{% extends "base.html" %}

{% block content %}
{# Leaflet servido em /static para evitar "Tracking Prevention blocked access to storage" no Edge (scripts de CDN terceiros). #}
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<script src="/static/vendor/leaflet/leaflet.js"></script>

<div class="h-[calc(100vh-3rem)] flex flex-col relative" x-data="mapController()">
    <!-- Header/Filter Overlay -->
    <div class="absolute top-4 right-6 z-[1000] w-72 space-y-3 pointer-events-none">
        <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-4 rounded-2xl shadow-2xl pointer-events-auto">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-blue-500"></i>
                    Frotas em Tempo Real
                </h2>
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            </div>
            <p class="text-[10px] text-slate-400" x-text="lastUpdateText">Atualizando...</p>
            
            <div class="mt-4 space-y-2 max-h-[40vh] overflow-y-auto custom-scrollbar">
                <template x-for="car in vehicles">
                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-800/50 border border-slate-700/30 hover:border-blue-500/50 transition-colors cursor-pointer"
                         @click="focusVehicle(car)">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-white" x-text="car.plate"></span>
                            <span class="text-[9px] text-slate-500" x-text="car.driver_name"></span>
                        </div>
                        <i data-lucide="navigation" class="w-3 h-3 text-slate-600"></i>
                    </div>
                </template>
                <div x-show="vehicles.length === 0" class="text-center py-6">
                    <i data-lucide="truck" class="w-8 h-8 text-slate-700 mx-auto mb-2"></i>
                    <p class="text-slate-500 text-[10px]">Nenhum caminhão ativo.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map" class="flex-1 w-full bg-slate-900"></div>
</div>

<script>
function mapController() {
    return {
        map: null,
        markers: {}, // {plate: marker}
        vehicles: [],
        lastUpdate: null,
        lastUpdateText: 'Nunca atualizado',
        
        init() {
            // Inicializar mapa
            this.map = L.map('map', {
                zoomControl: false
            }).setView([-23.5505, -46.6333], 12);
            
            L.control.zoom({ position: 'bottomright' }).addTo(this.map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(this.map);

            this.fetchLocations();
            setInterval(() => this.fetchLocations(), 30000); 
            
            setTimeout(() => lucide.createIcons(), 200);
        },

        async fetchLocations() {
            try {
                const res = await fetch('/api/gm/locations-realtime');
                if (!res.ok) throw new Error();
                const data = await res.json();
                this.vehicles = data;
                this.updateMarkers(data);
                this.lastUpdate = new Date();
                this.lastUpdateText = 'Atualizado às ' + this.lastUpdate.toLocaleTimeString('pt-BR');
                lucide.createIcons();
            } catch (e) {
                console.error('Erro no fetch do mapa', e);
            }
        },

        updateMarkers(data) {
            const currentPlates = new Set();
            
            data.forEach(v => {
                currentPlates.add(v.plate);
                
                if (this.markers[v.plate]) {
                    this.markers[v.plate].setLatLng([v.lat, v.lng]);
                } else {
                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="marker-pin bg-blue-600 border-2 border-white shadow-lg w-8 h-8 rounded-full flex items-center justify-center text-white"><i data-lucide="truck" class="w-4 h-4"></i></div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 32]
                    });

                    const marker = L.marker([v.lat, v.lng], { icon: icon }).addTo(this.map);
                    marker.bindPopup(`
                        <div class="p-2 min-w-[120px]">
                            <p class="font-bold text-sm text-slate-100">${v.plate}</p>
                            <p class="text-xs text-slate-400">${v.driver_name}</p>
                            <div class="mt-2 pt-2 border-t border-slate-700 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span class="text-[9px] text-emerald-400">Ativo agora</span>
                            </div>
                        </div>
                    `);
                    this.markers[v.plate] = marker;
                }
            });

            Object.keys(this.markers).forEach(plate => {
                if (!currentPlates.has(plate)) {
                    this.map.removeLayer(this.markers[plate]);
                    delete this.markers[plate];
                }
            });

            if (data.length > 0 && !this.lastUpdate) {
                const group = new L.featureGroup(Object.values(this.markers));
                this.map.fitBounds(group.getBounds().pad(0.2));
            }
        },

        focusVehicle(car) {
            if (this.markers[car.plate]) {
                this.map.flyTo([car.lat, car.lng], 16);
                this.markers[car.plate].openPopup();
            }
        }
    }
}
</script>

<style>
/* Leaflet Integration */
.leaflet-container { background: #0f172a !important; }
.leaflet-popup-content-wrapper {
    background: #1e293b !important;
    color: white !important;
    border: 1px solid #334155 !important;
    border-radius: 12px !important;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5) !important;
}
.leaflet-popup-tip { background: #1e293b !important; }
.leaflet-popup-close-button { color: #94a3b8 !important; }

.custom-div-icon { background: none !important; border: none !important; }
.marker-pin { transform: scale(1); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.marker-pin:hover { transform: scale(1.2); }

.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
</style>
{% endblock %}
