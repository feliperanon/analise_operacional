{% extends "base.html" %}

{% block content %}
<div class="flex flex-col h-full bg-slate-900" x-data="employeeDetail()" x-init="init()">

    <!-- Header -->
    <header
        class="bg-slate-950/50 backdrop-blur-md border-b border-slate-800 px-8 py-6 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-4">
            <a href="/admin/game/audit"
                class="p-2 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight" x-text="(employee && (employee.name || '').toUpperCase()) || 'Carregando...'"></h1>
                <p class="text-sm text-slate-400">
                    Matrícula: <span x-text="employee.registration_id"></span> •
                    Total XP: <span class="text-emerald-400 font-bold" x-text="formatNumber(employee.total_xp)"></span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Status Filter (Optional future feature) -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-5xl mx-auto">

            <!-- Timeline / List -->
            <div class="space-y-4">
                <template x-if="loading">
                    <div class="text-center py-12">
                        <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin mx-auto"></i>
                        <p class="mt-4 text-slate-500">Carregando histórico...</p>
                    </div>
                </template>

                <template x-for="item in history" :key="item.id">
                    <div class="bg-slate-800/50 rounded-xl border border-slate-700/50 p-4 transition-all hover:bg-slate-800 group"
                        :class="{'opacity-60 grayscale': item.status === 'rejected'}">

                        <div class="flex items-start justify-between gap-4">
                            <!-- Left: Icon & Info -->
                            <div class="flex items-start gap-4">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0"
                                    :class="statusBgClass(item.status)">
                                    <i :data-lucide="statusIcon(item.status)" class="w-5 h-5 text-white"></i>
                                </div>

                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-mono text-slate-500"
                                            x-text="formatDate(item.created_at)"></span>
                                        <span
                                            class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                                            :class="statusBadgeClass(item.status)"
                                            x-text="translateStatus(item.status)"></span>
                                    </div>

                                    <h3 class="text-white font-medium text-lg leading-tight mb-1">
                                        <span
                                            x-text="translateText(item.details.evento) || translateSource(item.source_type)"></span>
                                    </h3>

                                    <!-- Route Info (Enriched) -->
                                    <!-- Route Info (Enriched Multi-Route) -->
                                    <template x-if="item.route_info && item.route_info.routes">
                                        <div class="mb-3 space-y-1.5">
                                            <template x-for="(r, rIndex) in item.route_info.routes" :key="'r-' + rIndex">
                                                <div
                                                    class="p-2 bg-slate-900/40 rounded border border-slate-700/50 text-xs">
                                                    <div class="flex justify-between items-start mb-0.5">
                                                        <span class="font-bold text-white"
                                                            x-text="r.client_name"></span>
                                                        <span class="text-emerald-400/80"
                                                            x-text="formatDecimal(r.kg, 'kg')"></span>
                                                    </div>
                                                    <div class="text-slate-400 flex items-center gap-2">
                                                        <span
                                                            x-text="(r.start_time || '--:--') + ' - ' + (r.end_time || '--:--')"></span>
                                                        <span class="text-slate-600">•</span>
                                                        <span class="text-blue-300"
                                                            x-text="r.duration ? r.duration + 'h' : '?'"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Details Breakdown -->
                                    <div class="text-sm text-slate-400 space-y-0.5">
                                        <div x-show="item.details.uo || item.details.kg">
                                            <span
                                                x-text="[formatDecimal(item.details.uo, 'UO'), formatDecimal(item.details.kg, 'kg')].filter(Boolean).join(' • ')"></span>
                                        </div>
                                        <div x-show="item.details.regra_horario" class="text-slate-500 text-xs">
                                            <i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>
                                            <span x-text="translateText(item.details.regra_horario)"></span>
                                        </div>
                                        <div x-show="item.source_type && (item.source_type.includes('manual') || item.source_type.includes('admin'))"
                                            class="mt-2 bg-slate-900/50 p-2 rounded text-xs text-amber-200/80 italic border border-amber-500/10">
                                            Obs: <span x-text="item.reason"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Amount -->
                            <div class="text-right shrink-0">
                                <div class="text-xl font-bold font-mono" :class="amountClass(item)">
                                    <span x-text="item.amount > 0 ? '+' : ''"></span><span
                                        x-text="Math.round(item.amount)"></span> XP
                                </div>
                                <div class="text-[10px] text-slate-600 uppercase tracking-widest mt-1">
                                    ID: <span x-text="item.id"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <div x-show="!loading && history.length === 0" class="text-center py-16 text-slate-500">
                    <i data-lucide="clipboard-x" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                    <p>Nenhum registro encontrado para este colaborador.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('employeeDetail', () => ({
            employeeId: {{ employee.id }},
        employee: {},
        history: [],
        loading: true,

        init() {
        this.fetchData();
    },

        async fetchData() {
        this.loading = true;
        try {
            const res = await fetch(`/api/game/audit/employee/${this.employeeId}`);
            if(!res.ok) throw new Error('Falha ao carregar dados');
    const data = await res.json();
    this.employee = data.employee;
    this.history = data.history;

    // Re-init icons for new content
    this.$nextTick(() => lucide.createIcons());
            } catch (err) {
        console.error(err);
        alert('Erro ao carregar histórico: ' + err.message);
    } finally {
        this.loading = false;
    }
        },

    formatNumber(num) {
        return (num || 0).toLocaleString('pt-BR');
    },

    formatDate(isoStr) {
        if (!isoStr) return '-';
        const date = new Date(isoStr);
        return date.toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit', year: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });
    },

    formatDecimal(val, suffix) {
        if (val === null || val === undefined) return null;
        // Fix for when uo is a string with comma like "3,34"
        let num = typeof val === 'string' ? parseFloat(val.replace(',', '.')) : val;
        if (isNaN(num)) return val;

        let formatted = num.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        return suffix ? `${formatted} ${suffix}` : formatted;
    },

    translateSource(type) {
        const map = {
            'manual_admin': 'Ajuste Manual',
            'daily_auto': 'Rotina Diária',
            'gamification': 'Gamificação',
            'system': 'Sistema'
        };
        return map[type] || type || 'Transação';
    },

    translateText(text) {
        if (!text) return text;
        return text.toString()
            .replace(/\bEarly\b/g, 'Chegada Antecipada')
            .replace(/\bLate\b/g, 'Atraso')
            .replace(/\bTest\b/g, 'Teste')
            .replace(/\bEvent\b/g, 'Evento');
    },




    translateStatus(status) {
        const map = {
            'pending': 'Pendente',
            'confirmed': 'Confirmado',
            'rejected': 'Rejeitado',
            'provisional': 'Provisório'
        };
        return map[status] || status;
    },

    statusBadgeClass(status) {
        switch (status) {
            case 'confirmed': return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            case 'rejected': return 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
            case 'pending':
            case 'provisional': return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
            default: return 'bg-slate-700 text-slate-400';
        }
    },

    statusBgClass(status) {
        switch (status) {
            case 'confirmed': return 'bg-emerald-500';
            case 'rejected': return 'bg-rose-500';
            case 'pending':
            case 'provisional': return 'bg-amber-500';
            default: return 'bg-slate-700';
        }
    },

    statusIcon(status) {
        switch (status) {
            case 'confirmed': return 'check';
            case 'rejected': return 'x';
            case 'pending':
            case 'provisional': return 'clock';
            default: return 'help-circle';
        }
    },

    amountClass(item) {
        if (item.status === 'rejected') return 'text-slate-500 decoration-line-through decoration-slate-600/50';
        return item.amount >= 0 ? 'text-emerald-400' : 'text-rose-400';
    }
    }));
});
</script>
{% endblock %}
