<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Operação Inteligente</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-900 text-white flex items-center justify-center h-screen overflow-hidden relative">

    <!-- Background Effects -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div
            class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-blob">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-blob animation-delay-2000">
        </div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md p-8 rounded-2xl glass shadow-2xl border border-white/10 relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 tracking-tight">Bem-vindo</h1>
            <p class="text-slate-400 text-sm">Acesse o sistema de Operação Inteligente</p>
        </div>

        {% if error %}
        <div
            class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/50 text-red-200 text-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div
            class="mb-4 p-3 rounded-lg bg-emerald-500/20 border border-emerald-500/50 text-emerald-200 text-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 13l4 4L19 7"></path>
            </svg>
            {{ success }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-6" id="login-form">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">E-mail</label>
                <input type="email" name="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800/50 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="seuemail@empresa.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Senha</label>
                <div class="relative">
                    <input type="password" name="password" id="password" required
                        class="w-full px-4 py-3 pr-12 rounded-lg bg-slate-800/50 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                        placeholder="Sua senha">
                    <button type="button" onclick="togglePassword()" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors p-1"
                        title="Mostrar/ocultar senha">
                        <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="remember" name="remember"
                    class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer">
                <label for="remember" class="text-sm text-slate-400 cursor-pointer select-none">Lembrar meu e-mail</label>
            </div>

            <button type="submit"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5 transition-all duration-200">
                Entrar no Sistema
            </button>
            <div class="flex items-center justify-between text-sm">
                <a href="/reset" class="text-slate-400 hover:text-white transition-colors">Esqueci minha senha</a>
            </div>
        </form>

        <script>
        function togglePassword() {
            var passwordInput = document.getElementById('password');
            var eyeIcon = document.getElementById('eye-icon');
            var eyeOffIcon = document.getElementById('eye-off-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }

        // Carregar email salvo
        document.addEventListener('DOMContentLoaded', function() {
            var savedEmail = localStorage.getItem('remembered_email');
            var rememberCheckbox = document.getElementById('remember');
            var emailInput = document.getElementById('email');
            
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberCheckbox.checked = true;
            }
        });

        // Salvar email ao submeter
        document.getElementById('login-form').addEventListener('submit', function() {
            var rememberCheckbox = document.getElementById('remember');
            var emailInput = document.getElementById('email');
            
            if (rememberCheckbox.checked) {
                localStorage.setItem('remembered_email', emailInput.value);
            } else {
                localStorage.removeItem('remembered_email');
            }
        });
        </script>

        {% if google_enabled %}
        <div class="mt-6">
            <a href="/auth/google"
                class="w-full inline-flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-white text-slate-900 font-semibold hover:bg-slate-100 transition-colors">
                <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.22 3.2l6.86-6.86C35.9 1.9 30.3 0 24 0 14.6 0 6.5 5.38 2.7 13.2l7.98 6.2C12.4 13.2 17.7 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.5 24c0-1.64-.15-3.22-.43-4.75H24v9.02h12.67c-.55 2.97-2.23 5.48-4.75 7.18l7.26 5.64c4.25-3.92 6.7-9.7 6.7-17.09z"></path>
                    <path fill="#FBBC05" d="M10.68 28.1c-.5-1.5-.78-3.1-.78-4.7 0-1.63.28-3.22.78-4.72l-7.98-6.2C.99 15.7 0 19.74 0 23.4c0 3.66.99 7.7 2.7 10.92l7.98-6.22z"></path>
                    <path fill="#34A853" d="M24 48c6.3 0 11.6-2.08 15.48-5.62l-7.26-5.64c-2.02 1.36-4.62 2.16-8.22 2.16-6.3 0-11.62-3.7-13.54-8.8l-7.98 6.22C6.5 42.62 14.6 48 24 48z"></path>
                    <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                Entrar com Google
            </a>
        </div>
        {% endif %}
    </div>

</body>

</html>
