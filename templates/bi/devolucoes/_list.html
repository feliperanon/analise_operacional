<div id="bi-dev-table-panel" class="sys-card sys-card--surface employees-table-panel overflow-hidden p-0">
  <div class="employees-table-panel__head flex flex-col gap-3 border-b px-5 py-5 sm:px-6 lg:flex-row lg:items-start lg:justify-between lg:gap-8">
    <div class="min-w-0 flex-1">
      <p class="employees-table-panel__kicker">Operação</p>
      <h3 class="sys-section-heading employees-table-panel__title mt-1 text-lg sm:text-xl">Lista de devoluções</h3>
      <p class="employees-table-panel__lede mt-2 max-w-xl text-sm">Desktop: tabela. Mobile: cartões. Busca local sem recarregar.</p>
    </div>
    <div class="employees-table-panel__aside max-w-md text-xs leading-relaxed lg:pt-1 lg:text-right">
      <p id="bi-dev-state" class="employees-text-caption text-slate-600 dark:text-slate-300">Carregando dados…</p>
    </div>
  </div>

  <div class="sys-table-wrap sys-table-wrap--x-scroll">
    <table class="employees-data-table employees-data-table--compact bi-dev-data-table w-full min-w-full border-collapse text-left text-sm md:min-w-[1020px]" id="bi-dev-table">
      <thead class="employees-data-table__head sticky top-0 z-10 border-b font-semibold backdrop-blur">
        <tr>
          <th class="employees-data-table__th px-3 py-2 pl-5">Data</th>
          <th class="employees-data-table__th px-2 py-2">Cliente</th>
          <th class="employees-data-table__th px-2 py-2">Vendedor</th>
          <th class="employees-data-table__th px-2 py-2">Motorista</th>
          <th class="employees-data-table__th px-2 py-2">Motivo</th>
          <th class="employees-data-table__th px-2 py-2">Responsabilidade</th>
          <th class="employees-data-table__th px-2 py-2 text-right">Valor</th>
          <th class="employees-data-table__th px-2 py-2 text-right">% impacto</th>
          <th class="employees-data-table__th px-2 py-2">Status</th>
          <th class="employees-data-table__th employees-data-table__th--static px-2 py-2 pr-5 text-right">Ação</th>
        </tr>
      </thead>
      <tbody class="employees-data-table__body divide-y" id="bi-dev-table-body"></tbody>
    </table>
  </div>

  <div id="bi-dev-cards" class="bi-dev-cards grid gap-3 p-4 sm:p-5" aria-live="polite"></div>

  <div class="bi-dev-pagination flex justify-center border-t border-slate-200/80 px-4 py-4 dark:border-slate-700/80">
    <button type="button" class="sys-btn sys-btn--secondary" id="bi-dev-more">Carregar mais</button>
  </div>
</div>
