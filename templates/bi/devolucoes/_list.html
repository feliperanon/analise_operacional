<section class="sys-card sys-card--surface bi-dev-list">
  <div class="bi-dev-list__header">
    <h3>Lista detalhada</h3>
    <p id="bi-dev-state" class="text-xs text-slate-500">Carregando dados...</p>
  </div>
  <div class="bi-dev-table-wrap">
    <table class="sys-table" id="bi-dev-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente</th>
          <th>Vendedor</th>
          <th>Motorista</th>
          <th>Motivo</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="bi-dev-table-body"></tbody>
    </table>
  </div>
  <div id="bi-dev-cards" class="bi-dev-cards"></div>
  <div class="bi-dev-pagination">
    <button type="button" class="sys-btn sys-btn--secondary" id="bi-dev-more">Ver mais</button>
  </div>
</section>
