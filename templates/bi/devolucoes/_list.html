<div id="bi-dev-table-panel" class="sys-card sys-card--surface employees-table-panel bi-dev-table-panel overflow-hidden p-0">
  <div class="employees-table-panel__head flex flex-col gap-2 border-b px-4 py-3 sm:px-5 lg:flex-row lg:items-start lg:justify-between lg:gap-6">
    <div class="min-w-0 flex-1">
      <p class="employees-table-panel__kicker text-[10px]">Operação</p>
      <h3 class="sys-section-heading employees-table-panel__title mt-0.5 text-base font-semibold sm:text-lg">Lista de devoluções</h3>
      <p class="employees-table-panel__lede mt-1 max-w-xl text-[11px] text-slate-500 dark:text-slate-400 sm:text-xs">Busca local na lista (sem recarregar a página).</p>
    </div>
    <div class="employees-table-panel__aside w-full max-w-md lg:max-w-xs">
      <label class="sr-only" for="bi-dev-search">Buscar na lista</label>
      <div class="ops-toolbar-search employees-filter-bar__search w-full">
        <svg class="h-3.5 w-3.5 flex-shrink-0 opacity-60" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="search" id="bi-dev-search" class="ops-toolbar-search__input text-sm" placeholder="Cliente, NB, motivo, motorista…" autocomplete="off" />
      </div>
      <p id="bi-dev-state" class="employees-text-caption mt-1.5 text-right text-[11px] text-slate-600 dark:text-slate-300">Carregando dados…</p>
    </div>
  </div>

  <div id="bi-dev-table-empty" class="bi-dev-table-empty hidden border-b px-4 py-8 text-center sm:px-5" role="status">
    <p id="bi-dev-table-empty-title" class="text-sm font-medium text-slate-800 dark:text-slate-100">Nenhuma devolução encontrada para os filtros atuais.</p>
    <p id="bi-dev-table-empty-sub" class="mt-1 text-xs text-slate-500 dark:text-slate-400">Ajuste a busca na lista ou limpe os filtros da página.</p>
    <a href="/bi/devolucoes" class="sys-btn sys-btn--secondary mt-4 inline-flex text-xs">Limpar filtros</a>
  </div>

  <div class="sys-table-wrap sys-table-wrap--x-scroll bi-dev-table-wrap">
    <table class="employees-data-table employees-data-table--compact bi-dev-data-table w-full min-w-full border-collapse text-left text-sm md:min-w-[1120px]" id="bi-dev-table">
      <thead class="employees-data-table__head sticky top-0 z-10 border-b font-semibold backdrop-blur">
        <tr>
          <th class="employees-data-table__th bi-dev-th-sortable px-3 py-1.5 pl-4 text-xs" data-bi-dev-sort="data" scope="col" role="columnheader" aria-sort="none" title="Ordenar por data">
            <span class="bi-dev-th-sort__inner">Data <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="cliente" scope="col" role="columnheader" aria-sort="none" title="Ordenar por cliente">
            <span class="bi-dev-th-sort__inner">Cliente <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs whitespace-nowrap" data-bi-dev-sort="client_nb" scope="col" role="columnheader" aria-sort="none" title="Ordenar por NB">
            <span class="bi-dev-th-sort__inner">NB <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="vendedor" scope="col" role="columnheader" aria-sort="none" title="Ordenar por vendedor">
            <span class="bi-dev-th-sort__inner">Vendedor <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="motorista" scope="col" role="columnheader" aria-sort="none" title="Ordenar por motorista">
            <span class="bi-dev-th-sort__inner">Motorista <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="motivo" scope="col" role="columnheader" aria-sort="none" title="Ordenar por motivo">
            <span class="bi-dev-th-sort__inner">Motivo <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="responsabilidade" scope="col" role="columnheader" aria-sort="none" title="Ordenar por responsabilidade">
            <span class="bi-dev-th-sort__inner">Resp. <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-right text-xs" data-bi-dev-sort="valor" scope="col" role="columnheader" aria-sort="none" title="Ordenar por valor">
            <span class="bi-dev-th-sort__inner">Valor <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-right text-xs" data-bi-dev-sort="pct_impacto" scope="col" role="columnheader" aria-sort="none" title="Ordenar por % impacto">
            <span class="bi-dev-th-sort__inner">% impacto <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th bi-dev-th-sortable px-2 py-1.5 text-xs" data-bi-dev-sort="status" scope="col" role="columnheader" aria-sort="none" title="Ordenar por status">
            <span class="bi-dev-th-sort__inner">Status <span class="bi-dev-sort-ind" aria-hidden="true"></span></span>
          </th>
          <th class="employees-data-table__th employees-data-table__th--static px-2 py-1.5 pr-4 text-right text-xs" scope="col">Ação</th>
        </tr>
      </thead>
      <tbody class="employees-data-table__body divide-y" id="bi-dev-table-body"></tbody>
    </table>
  </div>

  <div id="bi-dev-cards" class="bi-dev-cards grid gap-2.5 p-3 sm:p-4" aria-live="polite"></div>

  <div class="bi-dev-pagination flex justify-center border-t border-slate-200/80 px-3 py-3 dark:border-slate-700/80">
    <button type="button" class="sys-btn sys-btn--secondary px-4 py-2 text-xs" id="bi-dev-more">Carregar mais</button>
  </div>
</div>
