{% extends "base.html" %}

{% block content %}
<div class="escala-module min-h-screen bg-slate-950/95 pb-20 lg:pb-6" x-data="escalaApp()">
    <!-- Cabeçalho mobile-first -->
    <header class="sticky top-0 z-30 border-b border-slate-700/80 bg-slate-900/95 backdrop-blur-sm">
        <div class="px-3 sm:px-4 py-2.5 sm:py-3">
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-tight text-white truncate">Escala Operacional</h1>
                <p class="text-[10px] sm:text-[11px] text-slate-500 mt-0.5">Caminhões, motoristas e ajudantes</p>
            </div>

            <div class="mt-2 sm:mt-3 flex flex-wrap items-center gap-2">
                <input type="date" x-model="filters.date" @change="loadData()"
                       class="rounded-lg border border-slate-600 bg-slate-800 px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm text-white outline-none focus:ring-1 focus:ring-amber-500/50 min-w-0">
                <select x-model="filters.shift" @change="loadData()"
                        class="rounded-lg border border-slate-600 bg-slate-800 px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm text-white outline-none focus:ring-1 focus:ring-amber-500/50 [&>option]:bg-slate-800">
                    {% for s in shifts %}
                    <option value="{{ s }}" {% if s == selected_shift %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- KPI único: Motoristas | Ajudantes | Escalados | Sem escala -->
            <div class="mt-2 sm:mt-3 rounded-lg bg-slate-800/70 border border-slate-600/50 px-3 py-2 sm:px-4 sm:py-2.5">
                <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="text-[9px] sm:text-[10px] text-slate-500 uppercase">Motoristas</span>
                        <span class="text-sm sm:text-base font-bold text-emerald-400" x-text="summary.motoristas">0</span>
                    </div>
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="text-[9px] sm:text-[10px] text-slate-500 uppercase">Ajudantes</span>
                        <span class="text-sm sm:text-base font-bold text-blue-400" x-text="summary.ajudantes">0</span>
                    </div>
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="text-[9px] sm:text-[10px] text-slate-500 uppercase">Escalados</span>
                        <span class="text-sm sm:text-base font-bold text-emerald-300" x-text="summary.escalados">0</span>
                    </div>
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="text-[9px] sm:text-[10px] text-slate-500 uppercase">Sem escala</span>
                        <span class="text-sm sm:text-base font-bold text-amber-300" x-text="summary.sem_escala">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Quadro principal: Escalados | Não escalados -->
    <main class="px-3 sm:px-4 py-3 sm:py-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4">
            <template x-for="col in columns" :key="col.id">
                <div class="escala-column min-w-0 rounded-xl border border-slate-700/80 bg-slate-800/40 flex flex-col">
                    <div class="px-3 py-2 sm:py-2.5 border-b border-slate-700/60 flex items-center justify-between shrink-0"
                         :class="col.headerClass">
                        <span class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider" x-text="col.label"></span>
                        <span class="text-[10px] sm:text-xs font-mono bg-white/10 px-1.5 py-0.5 rounded" x-text="(escalasByCol[col.id] || []).length">0</span>
                    </div>
                    <div class="flex-1 min-h-[140px] sm:min-h-[160px] p-2 sm:p-3 space-y-2 overflow-y-auto max-h-[calc(100vh-340px)] sm:max-h-[55vh]"
                         :data-column="col.id"
                         @dragover.prevent="dragOver($event, col.id)"
                         @drop.prevent="drop($event, col.id)">
                        <div x-show="!(escalasByCol[col.id] || []).length && !loading" class="py-6 text-center text-slate-500 text-xs sm:text-sm">
                            Nenhum caminhão nesta coluna
                        </div>
                        <!-- Colaboradores com permissão (apenas em Não escalados) -->
                        <template x-if="col.id === 'nao_escalado' && !loading">
                            <div class="space-y-3 pt-1">
                                <div x-show="(apiData.motoristas_disponiveis || []).length">
                                    <p class="text-[10px] text-emerald-500/90 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                                        <i data-lucide="user" class="w-3 h-3"></i> Motoristas disponíveis
                                    </p>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="m in (apiData.motoristas_disponiveis || [])" :key="m.id">
                                            <span class="inline-flex items-center px-2 py-1 rounded-md text-[11px] bg-emerald-500/15 border border-emerald-500/30 text-emerald-200" x-text="m.name"></span>
                                        </template>
                                    </div>
                                </div>
                                <div x-show="(apiData.ajudantes_disponiveis || []).length">
                                    <p class="text-[10px] text-blue-500/90 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                                        <i data-lucide="users" class="w-3 h-3"></i> Ajudantes disponíveis
                                    </p>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="a in (apiData.ajudantes_disponiveis || [])" :key="a.id">
                                            <span class="inline-flex items-center px-2 py-1 rounded-md text-[11px] bg-blue-500/15 border border-blue-500/30 text-blue-200" x-text="a.name"></span>
                                        </template>
                                    </div>
                                </div>
                                <div x-show="!(apiData.motoristas_disponiveis || []).length && !(apiData.ajudantes_disponiveis || []).length && (apiData.motoristas_todos || []).length + (apiData.ajudantes_todos || []).length > 0" class="text-[11px] text-slate-500">
                                    Todos os colaboradores já estão escalados.
                                </div>
                                <div x-show="!(apiData.motoristas_todos || []).length && !(apiData.ajudantes_todos || []).length" class="text-[11px] text-slate-500">
                                    Nenhum colaborador com permissão (Separação/Ajudante) cadastrado.
                                </div>
                            </div>
                        </template>
                        <template x-for="esc in (escalasByCol[col.id] || [])" :key="esc.id">
                            <div class="escala-card rounded-xl border border-slate-600/60 p-2.5 sm:p-3 bg-slate-800/90 hover:border-slate-500/50 transition-colors cursor-grab active:cursor-grabbing"
                                 :data-escala-id="esc.id"
                                 draggable="true"
                                 @dragstart="dragStart($event, esc)"
                                 @dragend="dragEnd($event)">
                                <!-- FIXO: Caminhão + Peso/tonelagem -->
                                <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-600/50">
                                    <i data-lucide="truck" class="w-4 h-4 text-amber-500 shrink-0"></i>
                                    <span class="text-sm font-bold text-white truncate flex-1" x-text="esc.vehicle_plate && esc.vehicle_plate !== '-' ? esc.vehicle_plate : 'Sem caminhão'"></span>
                                    <div class="flex gap-0.5 shrink-0">
                                        <button @click.stop="openQuickChange(esc, 'motorista')" class="p-1 rounded hover:bg-slate-600" title="Trocar motorista">
                                            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                        <button @click.stop="openQuickChange(esc, 'caminhao')" class="p-1 rounded hover:bg-slate-600" title="Trocar caminhão">
                                            <i data-lucide="truck" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                        <button @click.stop="openQuickChange(esc, 'ajudante')" class="p-1 rounded hover:bg-slate-600" title="Trocar ajudante">
                                            <i data-lucide="users" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1.5 text-[10px] mb-2">
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="formatKg(esc.total_weight)"></span>
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="formatMoeda(esc.total_value)"></span>
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="(esc.total_qty || 0) + ' paradas'"></span>
                                </div>
                                <!-- Motorista e Ajudantes (alteração via botões) -->
                                <div class="space-y-1.5">
                                    <div class="flex-1 min-w-0 rounded-lg bg-emerald-500/15 border border-emerald-500/30 px-2 py-1.5 flex items-center gap-1.5">
                                        <i data-lucide="user" class="w-3 h-3 text-emerald-400 shrink-0"></i>
                                        <span class="text-xs font-medium text-emerald-200 truncate" x-text="esc.driver_name || '—'"></span>
                                    </div>
                                    <template x-for="(hname, i) in (esc.helper_names || [])" :key="i">
                                        <div class="rounded-lg bg-blue-500/15 border border-blue-500/30 px-2 py-1.5 flex items-center gap-1.5">
                                            <i data-lucide="users" class="w-3 h-3 text-blue-400 shrink-0"></i>
                                            <span class="text-xs font-medium text-blue-200 truncate" x-text="hname"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Modal troca rápida -->
    <div x-show="quickChange.open" x-cloak
         x-transition
         class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="absolute inset-0 bg-black/70" @click="quickChange.open = false"></div>
        <div class="relative w-full max-w-md max-h-[85vh] sm:max-h-[80vh] rounded-t-2xl sm:rounded-xl bg-slate-900 border border-slate-700 shadow-xl overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-slate-700 flex justify-between items-center shrink-0">
                <h4 class="text-sm font-semibold text-white" x-text="'Trocar ' + quickChange.campo"></h4>
                <button @click="quickChange.open = false" class="p-2 rounded-lg hover:bg-slate-700 text-slate-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-4 space-y-1 flex-1 min-h-0">
                <template x-if="quickChange.campo === 'motorista'">
                    <template x-for="m in (apiData.motoristas_todos || apiData.motoristas_disponiveis || [])" :key="m.id">
                        <button @click="applyQuickChange(m.id, null, null)"
                                class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-700/80 text-sm text-white flex items-center gap-2">
                            <i data-lucide="user" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                            <span x-text="m.name"></span>
                        </button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'caminhao'">
                    <template x-for="v in (apiData.vehicles || [])" :key="v.id">
                        <button @click="applyQuickChange(null, v.placa, null)"
                                class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-700/80 text-sm text-white flex items-center gap-2">
                            <i data-lucide="truck" class="w-4 h-4 text-amber-500 shrink-0"></i>
                            <span x-text="v.placa || '—'"></span>
                        </button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'ajudante'">
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500 mb-2">Selecione ajudantes (múltipla escolha)</p>
                        <template x-for="a in (apiData.ajudantes_todos || apiData.ajudantes_disponiveis || [])" :key="a.id">
                            <label class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700/50 cursor-pointer">
                                <input type="checkbox" :value="a.id" x-model="quickChange.ajudantesSelected">
                                <span class="text-sm text-white" x-text="a.name"></span>
                            </label>
                        </template>
                        <button @click="applyQuickChange(null, null, quickChange.ajudantesSelected)"
                                class="mt-3 w-full py-2 rounded-lg bg-amber-600 text-white text-sm font-semibold">
                            Aplicar
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Toast feedback -->
    <div x-show="toast.show" x-cloak
         x-transition
         class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm z-[70] px-4 py-3 rounded-lg shadow-lg"
         :class="toast.ok ? 'bg-emerald-600/95 text-white' : 'bg-red-600/95 text-white'">
        <p class="text-sm font-medium" x-text="toast.message"></p>
    </div>
</div>

<script>
window.__escalaInit = { date: "{{ selected_date }}", shift: "{{ selected_shift | e }}" };
</script>
<script src="/static/js/escala.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
{% endblock %}
