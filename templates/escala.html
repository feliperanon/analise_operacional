{% extends "base.html" %}

{% block content %}
<div class="escala-module min-h-screen bg-slate-950/95 pb-24 lg:pb-6" x-data="escalaApp()">
    <!-- Cabeçalho resumido - mobile first -->
    <header class="sticky top-0 z-30 border-b border-slate-700/80 bg-slate-900/95 backdrop-blur-sm">
        <div class="px-4 py-3">
            <div class="flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <h1 class="text-lg font-bold tracking-tight text-white truncate">Escala Operacional</h1>
                    <p class="text-[11px] text-slate-500 mt-0.5">Quadro de motoristas, caminhões e ajudantes</p>
                </div>
                <a href="/separacao?date={{ selected_date }}&shift={{ selected_shift | urlencode }}" 
                   class="shrink-0 inline-flex items-center gap-1.5 rounded-lg bg-amber-600/90 px-3 py-2 text-xs font-semibold text-white hover:bg-amber-500 transition-colors"
                   title="Abrir página de Entregas">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    Entregas
                </a>
            </div>

            <div class="mt-3 flex flex-wrap items-center gap-2">
                <input type="date" x-model="filters.date" @change="loadData()"
                       class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white outline-none focus:ring-1 focus:ring-amber-500/50">
                <select x-model="filters.shift" @change="loadData()"
                        class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white outline-none focus:ring-1 focus:ring-amber-500/50 [&>option]:bg-slate-800">
                    {% for s in shifts %}
                    <option value="{{ s }}" {% if s == selected_shift %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- KPIs compactos -->
            <div class="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                <div class="rounded-lg bg-slate-800/60 border border-slate-600/50 px-2.5 py-2">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Escalas</p>
                    <p class="text-base font-bold text-white" x-text="summary.total">0</p>
                </div>
                <div class="rounded-lg bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-2">
                    <p class="text-[10px] text-emerald-400 uppercase tracking-wider">Completas</p>
                    <p class="text-base font-bold text-emerald-300" x-text="summary.completas">0</p>
                </div>
                <div class="rounded-lg bg-amber-500/10 border border-amber-500/30 px-2.5 py-2">
                    <p class="text-[10px] text-amber-400 uppercase tracking-wider">Pendentes</p>
                    <p class="text-base font-bold text-amber-300" x-text="summary.pendentes">0</p>
                </div>
                <div class="rounded-lg bg-violet-500/10 border border-violet-500/30 px-2.5 py-2">
                    <p class="text-[10px] text-violet-400 uppercase tracking-wider">Em ajuste</p>
                    <p class="text-base font-bold text-violet-300" x-text="summary.em_ajuste">0</p>
                </div>
                <div class="rounded-lg bg-slate-800/60 border border-slate-600/50 px-2.5 py-2 col-span-2 sm:col-span-1">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Peso / Valor</p>
                    <p class="text-sm font-semibold text-white" x-text="formatPesoValor()">—</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Botão banco de recursos (mobile) -->
    <div class="fixed bottom-20 right-4 z-40 lg:hidden">
        <button @click="drawerOpen = true"
                class="flex h-14 w-14 items-center justify-center rounded-full bg-amber-600 text-white shadow-lg hover:bg-amber-500 active:scale-95 transition-transform">
            <i data-lucide="users" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Drawer / Painel lateral - Banco de recursos -->
    <div x-show="drawerOpen" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full"
         @click.self="drawerOpen = false"
         class="fixed inset-0 z-50 flex flex-col justify-end lg:relative lg:inset-auto lg:flex-initial">
        <div class="absolute inset-0 bg-black/60 lg:hidden" @click="drawerOpen = false"></div>
        <div class="relative z-10 max-h-[70vh] lg:max-h-none rounded-t-2xl lg:rounded-xl border border-slate-700 bg-slate-900 shadow-xl lg:shadow-none overflow-hidden">
            <div class="sticky top-0 flex items-center justify-between border-b border-slate-700 bg-slate-800/90 px-4 py-3">
                <h3 class="text-sm font-semibold text-white">Recursos disponíveis</h3>
                <button @click="drawerOpen = false" class="p-2 rounded-lg hover:bg-slate-700 text-slate-400 lg:hidden">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-4 space-y-4 max-h-[60vh] lg:max-h-48">
                <div>
                    <p class="text-[10px] text-slate-500 uppercase mb-1">Motoristas</p>
                    <div class="flex flex-wrap gap-1.5" id="recursos-motoristas"></div>
                </div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase mb-1">Ajudantes</p>
                    <div class="flex flex-wrap gap-1.5" id="recursos-ajudantes"></div>
                </div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase mb-1">Caminhões</p>
                    <div class="flex flex-wrap gap-1.5" id="recursos-caminhoes"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quadro principal - Colunas -->
    <main class="px-4 py-4">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 overflow-x-auto pb-4">
            <template x-for="col in columns" :key="col.id">
                <div class="escala-column min-w-[280px] rounded-xl border border-slate-700/80 bg-slate-800/40 flex flex-col">
                    <div class="px-3 py-2.5 border-b border-slate-700/60 flex items-center justify-between"
                         :class="col.headerClass">
                        <span class="text-xs font-semibold uppercase tracking-wider" x-text="col.label"></span>
                        <span class="text-xs font-mono bg-white/10 px-1.5 py-0.5 rounded" x-text="(escalasByCol[col.id] || []).length"></span>
                    </div>
                    <div class="flex-1 min-h-[120px] p-2 space-y-2 overflow-y-auto max-h-[50vh] lg:max-h-[60vh]"
                         :data-column="col.id"
                         @dragover.prevent="dragOver($event, col.id)"
                         @drop.prevent="drop($event, col.id)">
                        <div x-show="!(escalasByCol[col.id] || []).length && !loading" class="py-6 text-center text-slate-500 text-sm">
                            Nenhum card nesta coluna
                        </div>
                        <template x-for="esc in (escalasByCol[col.id] || [])" :key="esc.id">
                            <div class="escala-card rounded-lg border p-3 bg-slate-800/80 hover:border-slate-500/50 transition-colors cursor-grab active:cursor-grabbing draggable"
                                 :data-escala-id="esc.id"
                                 draggable="true"
                                 @dragstart="dragStart($event, esc)"
                                 @dragend="dragEnd($event)">
                                <div class="flex items-start justify-between gap-2 mb-2">
                                    <span class="text-xs font-semibold text-slate-300 truncate flex-1" x-text="esc.driver_name"></span>
                                    <div class="flex gap-1 shrink-0">
                                        <button @click.stop="openQuickChange(esc, 'motorista')" class="p-1 rounded hover:bg-slate-600" title="Trocar motorista">
                                            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                        <button @click.stop="openQuickChange(esc, 'caminhao')" class="p-1 rounded hover:bg-slate-600" title="Trocar caminhão">
                                            <i data-lucide="truck" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                        <button @click.stop="openQuickChange(esc, 'ajudante')" class="p-1 rounded hover:bg-slate-600" title="Trocar ajudante">
                                            <i data-lucide="users" class="w-3.5 h-3.5 text-slate-400"></i>
                                        </button>
                                    </div>
                                </div>
                                <p class="text-[11px] text-slate-500 flex items-center gap-1 mb-1">
                                    <i data-lucide="truck" class="w-3 h-3 shrink-0"></i>
                                    <span x-text="esc.vehicle_plate || '—'"></span>
                                </p>
                                <p class="text-[11px] text-slate-500 flex items-center gap-1 mb-2" x-show="esc.helper_names && esc.helper_names.length">
                                    <i data-lucide="users" class="w-3 h-3 shrink-0"></i>
                                    <span x-text="(esc.helper_names || []).join(', ') || '—'"></span>
                                </p>
                                <div class="flex flex-wrap gap-2 text-[10px]">
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="formatKg(esc.total_weight)"></span>
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="formatMoeda(esc.total_value)"></span>
                                    <span class="px-1.5 py-0.5 rounded bg-slate-700/80 text-slate-300" x-text="(esc.total_qty || 0) + ' paradas'"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Modal troca rápida -->
    <div x-show="quickChange.open" x-cloak
         x-transition
         class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="absolute inset-0 bg-black/70" @click="quickChange.open = false"></div>
        <div class="relative w-full max-w-md max-h-[80vh] rounded-t-2xl sm:rounded-xl bg-slate-900 border border-slate-700 shadow-xl overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <h4 class="text-sm font-semibold text-white" x-text="'Trocar ' + quickChange.campo"></h4>
                <button @click="quickChange.open = false" class="p-2 rounded-lg hover:bg-slate-700 text-slate-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-4 space-y-1 flex-1">
                <template x-if="quickChange.campo === 'motorista'">
                    <template x-for="m in apiData.motoristas_disponiveis || []" :key="m.id">
                        <button @click="applyQuickChange(m.id, null, null)"
                                class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-700/80 text-sm text-white flex items-center gap-2">
                            <i data-lucide="user" class="w-4 h-4 text-slate-500 shrink-0"></i>
                            <span x-text="m.name"></span>
                        </button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'caminhao'">
                    <template x-for="v in (apiData.vehicles || [])" :key="v.id">
                        <button @click="applyQuickChange(null, v.placa, null)"
                                class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-700/80 text-sm text-white flex items-center gap-2">
                            <i data-lucide="truck" class="w-4 h-4 text-slate-500 shrink-0"></i>
                            <span x-text="v.placa || '—'"></span>
                        </button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'ajudante'">
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500 mb-2">Selecione ajudantes (múltipla escolha)</p>
                        <template x-for="a in (apiData.ajudantes_disponiveis || [])" :key="a.id">
                            <label class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-700/50 cursor-pointer">
                                <input type="checkbox" :value="a.id" x-model="quickChange.ajudantesSelected">
                                <span class="text-sm text-white" x-text="a.name"></span>
                            </label>
                        </template>
                        <button @click="applyQuickChange(null, null, quickChange.ajudantesSelected)"
                                class="mt-3 w-full py-2 rounded-lg bg-amber-600 text-white text-sm font-semibold">
                            Aplicar
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Toast feedback -->
    <div x-show="toast.show" x-cloak
         x-transition
         class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm z-[70] px-4 py-3 rounded-lg shadow-lg"
         :class="toast.ok ? 'bg-emerald-600/95 text-white' : 'bg-red-600/95 text-white'">
        <p class="text-sm font-medium" x-text="toast.message"></p>
    </div>
</div>

<script>
window.__escalaInit = { date: "{{ selected_date }}", shift: "{{ selected_shift | e }}" };
</script>
<script src="/static/js/escala.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
{% endblock %}
