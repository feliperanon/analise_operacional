{% extends "dashboard_tv.html" %}

{% block title %}Painel TV Fire · Gestão Avista{% endblock %}

{% block head_extra %}
{{ super() }}
<style>
/* Ajustes exclusivos para Fire TV: layout fixo e previsível. */
.tv-dashboard-page .sys-kpi-shell .sys-kpi-grid.employees-kpi-row.tv-kpi-mega-grid {
    display: grid;
    grid-template-columns: repeat(11, minmax(0, 1fr)) !important;
    gap: 0.3rem !important;
    overflow: hidden !important;
}

.tv-dashboard-page .tv-kpi-mega-grid > .sys-kpi-card {
    min-width: 0 !important;
    min-height: 4.55rem !important;
}

.tv-dashboard-page .tv-kpi-mega-grid > .sys-kpi-card .sys-kpi-cell-inner {
    padding: 0.38rem 0.45rem !important;
}

.tv-dashboard-page .tv-kpi-mega-grid .employees-kpi__head {
    gap: 0.25rem !important;
    align-items: flex-start !important;
}

.tv-dashboard-page .tv-kpi-mega-grid .sys-kpi-label {
    font-size: 0.5rem !important;
    line-height: 1.08 !important;
    letter-spacing: 0.01em !important;
    white-space: normal !important;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    text-overflow: clip;
    min-height: 1.08rem;
}

.tv-dashboard-page .tv-kpi-mega-grid .employees-kpi__value {
    font-size: 0.68rem !important;
    line-height: 1.05 !important;
    white-space: nowrap;

.tv-dashboard-page #tv-exceptions-panel .tv-exc-unified-body,

.tv-dashboard-page .tv-balloon-driver .tv-balloon-title-line {

    line-height: 1.08 !important;

    font-size: 0.58rem !important;
    line-height: 1.08 !important;

    text-overflow: ellipsis;

}

.tv-dashboard-page .tv-balloon-driver .tv-progress-inline {
    font-size: 0.5rem !important;
    gap: 0.18rem !important;
}

.tv-dashboard-page .tv-balloon-driver .tv-balloon-meta,
.tv-dashboard-page .tv-balloon-driver .tv-meta-placa,
.tv-dashboard-page .tv-balloon-driver .tv-ajud-line {
    font-size: 0.48rem !important;
    line-height: 1.05 !important;
}

.tv-dashboard-page .tv-balloon-driver .tv-balloon-activity-strip {
    padding: 0.14rem 0.24rem !important;
}

.tv-dashboard-page .tv-balloon-driver .tv-balloon-activity-client,
.tv-dashboard-page .tv-balloon-driver .tv-balloon-activity-times,
.tv-dashboard-page .tv-balloon-driver .tv-balloon-eta {
    font-size: 0.5rem !important;
    line-height: 1.05 !important;
}

.tv-dashboard-page .tv-balloon-driver .tv-balloon-eta {

}

.tv-dashboard-page .tv-balloon-driver .tv-balloon-list-row,

    padding-top: 0.06rem !important;
    padding-bottom: 0.06rem !important;
}
</style>
{% endblock %}

{% block body_scripts %}
<script>
// Polyfills para compatibilidade com navegadores embarcados (ex.: Fire TV Stick/Silk antigo).
(function() {
    if (typeof window.Promise !== 'function') {
        var PENDING = 0, FULFILLED = 1, REJECTED = 2;
        function SimplePromise(executor) {
            var self = this;
            self.state = PENDING;
            self.value = undefined;
            self.handlers = [];
            function fulfill(value) {
                if (self.state !== PENDING) return;
                self.state = FULFILLED;
                self.value = value;
                process();
            }
            function reject(reason) {
                if (self.state !== PENDING) return;
                self.state = REJECTED;
                self.value = reason;
                process();
            }
            function process() {
                setTimeout(function() {
                    while (self.handlers.length) {
                        handle(self.handlers.shift());
                    }
                }, 0);
            }
            function handle(handler) {
                var cb = self.state === FULFILLED ? handler.onFulfilled : handler.onRejected;
                if (typeof cb !== 'function') {
                    (self.state === FULFILLED ? handler.resolve : handler.reject)(self.value);
                    return;
                }
                try {
                    handler.resolve(cb(self.value));
                } catch (e) {
                    handler.reject(e);
                }
            }
            self.then = function(onFulfilled, onRejected) {
                return new SimplePromise(function(resolve, reject) {
                    var handler = { onFulfilled: onFulfilled, onRejected: onRejected, resolve: resolve, reject: reject };
                    if (self.state === PENDING) self.handlers.push(handler);
                    else setTimeout(function() { handle(handler); }, 0);
                });
            };
            self.catch = function(onRejected) { return self.then(null, onRejected); };
            try { executor(fulfill, reject); } catch (e) { reject(e); }
        }
        SimplePromise.resolve = function(value) { return new SimplePromise(function(resolve) { resolve(value); }); };
        SimplePromise.reject = function(reason) { return new SimplePromise(function(_, reject) { reject(reason); }); };
        window.Promise = SimplePromise;
    }

    if (window.NodeList && !NodeList.prototype.forEach) {
        NodeList.prototype.forEach = function(callback, thisArg) {
            thisArg = thisArg || window;
            for (var i = 0; i < this.length; i++) callback.call(thisArg, this[i], i, this);
        };
    }

    if (!String.prototype.padStart) {
        String.prototype.padStart = function padStart(targetLength, padString) {
            var str = String(this);
            targetLength = targetLength >> 0;
            padString = String(typeof padString !== 'undefined' ? padString : ' ');
            if (str.length >= targetLength) return str;
            targetLength = targetLength - str.length;
            if (targetLength > padString.length) {
                padString += new Array(Math.ceil(targetLength / padString.length) + 1).join(padString);
            }
            return padString.slice(0, targetLength) + str;
        };
    }

    if (typeof window.CustomEvent !== 'function') {
        function CustomEvent(event, params) {
            params = params || { bubbles: false, cancelable: false, detail: null };
            var evt = document.createEvent('CustomEvent');
            evt.initCustomEvent(event, params.bubbles, params.cancelable, params.detail);
            return evt;
        }
        CustomEvent.prototype = window.Event ? window.Event.prototype : {};
        window.CustomEvent = CustomEvent;
    }

    if (window.Element && !Element.prototype.matches) {
        Element.prototype.matches = Element.prototype.msMatchesSelector || Element.prototype.webkitMatchesSelector;
    }

    if (window.Element && !Element.prototype.closest) {
        Element.prototype.closest = function(selector) {
            var el = this;
            while (el && el.nodeType === 1) {
                if (el.matches(selector)) return el;
                el = el.parentElement || el.parentNode;
            }
            return null;
        };
    }

    if (!window.fetch) {
        window.fetch = function(url, options) {
            options = options || {};
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open(options.method || 'GET', url, true);
                xhr.withCredentials = options.credentials === 'include' || options.credentials === 'same-origin';
                xhr.onreadystatechange = function() {
                    if (xhr.readyState !== 4) return;
                    var response = {
                        ok: xhr.status >= 200 && xhr.status < 300,
                        status: xhr.status,
                        statusText: xhr.statusText,
                        text: function() { return Promise.resolve(xhr.responseText); },
                        json: function() {
                            try {
                                return Promise.resolve(JSON.parse(xhr.responseText));
                            } catch (e) {
                                return Promise.reject(e);
                            }
                        }
                    };
                    resolve(response);
                };
                xhr.onerror = function() { reject(new TypeError('Network request failed')); };
                xhr.send(options.body || null);
            });
        };
    }
})();
</script>
