{% extends "mobile/layout.html" %}

{% block title %}Escala Operacional{% endblock %}

{% block content %}
<div class="escala-module min-h-screen flex flex-col pb-safe" x-data="escalaApp()" style="background: var(--color-bg);">
    <header class="container-mobile py-3 border-b shrink-0 sticky top-0 z-30" style="border-color: var(--color-border); background: var(--color-surface);">
        <div class="flex items-center justify-between gap-3">
            <a href="/mobile/dashboard" class="touch-target-icon flex items-center justify-center rounded-lg" style="background: var(--color-surface-solid); color: var(--color-text);">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex-1 min-w-0">
                <span class="text-[10px] font-bold uppercase tracking-widest" style="color: var(--color-primary);">Escala</span>
                <h1 class="text-section truncate" style="color: var(--color-text);">Escala Operacional</h1>
            </div>
        </div>
    </header>

    <div class="container-mobile py-4 flex-1 overflow-auto">
        <div class="flex flex-wrap items-center gap-2 mb-4">
            <input type="date" x-model="filters.date" @change="loadData()"
                   class="rounded-lg px-3 py-2 text-xs outline-none focus:ring-1 min-w-0"
                   style="background: var(--color-surface-solid); border: 1px solid var(--color-border); color: var(--color-text);">
            <select x-model="filters.shift" @change="loadData()"
                    class="rounded-lg px-3 py-2 text-xs outline-none focus:ring-1"
                    style="background: var(--color-surface-solid); border: 1px solid var(--color-border); color: var(--color-text);">
                {% for s in shifts %}
                <option value="{{ s }}" {% if s == selected_shift %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="rounded-lg px-3 py-2 mb-4" style="background: var(--color-surface-solid); border: 1px solid var(--color-border);">
            <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
                <div class="flex items-center gap-1.5"><span class="text-[9px] uppercase" style="color: var(--color-text-muted);">Motoristas</span><span class="text-sm font-bold text-emerald-400" x-text="summary.motoristas">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-[9px] uppercase" style="color: var(--color-text-muted);">Ajudantes</span><span class="text-sm font-bold text-blue-400" x-text="summary.ajudantes">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-[9px] uppercase" style="color: var(--color-text-muted);">Escalados</span><span class="text-sm font-bold text-emerald-300" x-text="summary.escalados">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-[9px] uppercase" style="color: var(--color-text-muted);">Sem escala</span><span class="text-sm font-bold text-amber-300" x-text="summary.sem_escala">0</span></div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <template x-for="col in columns" :key="col.id">
                <div class="escala-column min-w-0 rounded-xl flex flex-col" style="border: 1px solid var(--color-border); background: var(--color-surface);">
                    <div class="px-3 py-2.5 border-b flex items-center justify-between shrink-0" :class="col.headerClass" style="border-color: var(--color-border);">
                        <span class="text-[10px] font-semibold uppercase tracking-wider" x-text="col.label"></span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded" style="background: rgba(255,255,255,0.1);" x-text="(escalasByCol[col.id] || []).length">0</span>
                    </div>
                    <div class="flex-1 min-h-[140px] p-3 space-y-2 overflow-y-auto max-h-[50vh]"
                         :data-column="col.id"
                         @dragover.prevent="dragOver($event, col.id)"
                         @drop.prevent="drop($event, col.id)">
                        <div x-show="!(escalasByCol[col.id] || []).length && !loading" class="py-8 text-center text-sm" style="color: var(--color-text-muted);">Nenhum caminhão nesta coluna</div>
                        <template x-if="col.id === 'nao_escalado' && !loading">
                            <div class="space-y-3 pt-1">
                                <div x-show="(apiData.motoristas_disponiveis || []).length">
                                    <p class="text-[10px] text-emerald-500/90 uppercase tracking-wider mb-1.5 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> Motoristas disponíveis</p>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="m in (apiData.motoristas_disponiveis || [])" :key="m.id">
                                            <span class="inline-flex px-2 py-1 rounded-md text-[11px] bg-emerald-500/15 border border-emerald-500/30 text-emerald-200" x-text="m.name"></span>
                                        </template>
                                    </div>
                                </div>
                                <div x-show="(apiData.ajudantes_disponiveis || []).length">
                                    <p class="text-[10px] text-blue-500/90 uppercase tracking-wider mb-1.5 flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> Ajudantes disponíveis</p>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="a in (apiData.ajudantes_disponiveis || [])" :key="a.id">
                                            <span class="inline-flex px-2 py-1 rounded-md text-[11px] bg-blue-500/15 border border-blue-500/30 text-blue-200" x-text="a.name"></span>
                                        </template>
                                    </div>
                                </div>
                                <div x-show="!(apiData.motoristas_disponiveis || []).length && !(apiData.ajudantes_disponiveis || []).length && (apiData.motoristas_todos || []).length + (apiData.ajudantes_todos || []).length > 0" class="text-[11px]" style="color: var(--color-text-muted);">Todos os colaboradores já estão escalados.</div>
                                <div x-show="!(apiData.motoristas_todos || []).length && !(apiData.ajudantes_todos || []).length" class="text-[11px]" style="color: var(--color-text-muted);">Nenhum colaborador com permissão cadastrado.</div>
                            </div>
                        </template>
                        <template x-for="esc in (escalasByCol[col.id] || [])" :key="esc.id">
                            <div class="escala-card rounded-xl border p-3 transition-colors cursor-grab active:cursor-grabbing"
                                 :data-escala-id="esc.id" draggable="true"
                                 @dragstart="dragStart($event, esc)" @dragend="dragEnd($event)"
                                 style="background: var(--color-surface); border-color: var(--color-border);">
                                <!-- FIXO: Caminhão + Tonelagem -->
                                <div class="flex items-center gap-2 mb-2 pb-2 border-b" style="border-color: var(--color-border);">
                                    <i data-lucide="truck" class="w-4 h-4 text-amber-500 shrink-0"></i>
                                    <span class="text-sm font-bold truncate flex-1" style="color: var(--color-text);" x-text="esc.vehicle_plate && esc.vehicle_plate !== '-' ? esc.vehicle_plate : 'Sem caminhão'"></span>
                                    <div class="flex gap-0.5 shrink-0">
                                        <button @click.stop="openQuickChange(esc, 'motorista')" class="p-1.5 rounded touch-target" title="Trocar motorista" style="background: rgba(255,255,255,0.05);"><i data-lucide="user" class="w-4 h-4 text-slate-400"></i></button>
                                        <button @click.stop="openQuickChange(esc, 'caminhao')" class="p-1.5 rounded touch-target" title="Trocar caminhão" style="background: rgba(255,255,255,0.05);"><i data-lucide="truck" class="w-4 h-4 text-slate-400"></i></button>
                                        <button @click.stop="openQuickChange(esc, 'ajudante')" class="p-1.5 rounded touch-target" title="Trocar ajudante" style="background: rgba(255,255,255,0.05);"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i></button>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1.5 text-[10px] mb-2" style="color: var(--color-text-muted);">
                                    <span class="px-1.5 py-0.5 rounded" style="background: rgba(255,255,255,0.05);" x-text="formatKg(esc.total_weight)"></span>
                                    <span class="px-1.5 py-0.5 rounded" style="background: rgba(255,255,255,0.05);" x-text="formatMoeda(esc.total_value)"></span>
                                    <span class="px-1.5 py-0.5 rounded" style="background: rgba(255,255,255,0.05);" x-text="(esc.total_qty || 0) + ' paradas'"></span>
                                </div>
                                <!-- Motorista e Ajudantes (alteração via botões) -->
                                <div class="space-y-1.5">
                                    <div class="flex items-center gap-2 rounded-lg px-2 py-1.5 border border-emerald-500/30 bg-emerald-500/15">
                                        <i data-lucide="user" class="w-3 h-3 text-emerald-400 shrink-0"></i>
                                        <span class="text-xs font-medium text-emerald-200 truncate flex-1" x-text="esc.driver_name || '—'"></span>
                                    </div>
                                    <template x-for="(hname, i) in (esc.helper_names || [])" :key="i">
                                        <div class="rounded-lg px-2 py-1.5 flex items-center gap-1.5 border border-blue-500/30 bg-blue-500/15">
                                            <i data-lucide="users" class="w-3 h-3 text-blue-400 shrink-0"></i>
                                            <span class="text-xs font-medium text-blue-200 truncate" x-text="hname"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Modal troca rápida -->
    <div x-show="quickChange.open" x-cloak x-transition class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="absolute inset-0 bg-black/70" @click="quickChange.open = false"></div>
        <div class="relative w-full max-w-md max-h-[85vh] rounded-t-2xl sm:rounded-xl overflow-hidden flex flex-col" style="background: var(--color-surface); border: 1px solid var(--color-border);">
            <div class="px-4 py-3 border-b flex justify-between items-center shrink-0" style="border-color: var(--color-border);">
                <h4 class="text-sm font-semibold" style="color: var(--color-text);" x-text="'Trocar ' + quickChange.campo"></h4>
                <button @click="quickChange.open = false" class="p-2 rounded-lg touch-target" style="color: var(--color-text-muted);"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="overflow-y-auto p-4 space-y-1 flex-1 min-h-0">
                <template x-if="quickChange.campo === 'motorista'">
                    <template x-for="m in (apiData.motoristas_todos || apiData.motoristas_disponiveis || [])" :key="m.id">
                        <button @click="applyQuickChange(m.id, null, null)" class="w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center gap-2 touch-target" style="color: var(--color-text);"><i data-lucide="user" class="w-4 h-4 text-emerald-500 shrink-0"></i><span x-text="m.name"></span></button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'caminhao'">
                    <template x-for="v in (apiData.vehicles || [])" :key="v.id">
                        <button @click="applyQuickChange(null, v.placa, null)" class="w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center gap-2 touch-target" style="color: var(--color-text);"><i data-lucide="truck" class="w-4 h-4 text-amber-500 shrink-0"></i><span x-text="v.placa || '—'"></span></button>
                    </template>
                </template>
                <template x-if="quickChange.campo === 'ajudante'">
                    <div class="space-y-2">
                        <p class="text-xs mb-2" style="color: var(--color-text-muted);">Selecione ajudantes (múltipla escolha)</p>
                        <template x-for="a in (apiData.ajudantes_todos || apiData.ajudantes_disponiveis || [])" :key="a.id">
                            <label class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer touch-target"><input type="checkbox" :value="a.id" x-model="quickChange.ajudantesSelected"><span class="text-sm" style="color: var(--color-text);" x-text="a.name"></span></label>
                        </template>
                        <button @click="applyQuickChange(null, null, quickChange.ajudantesSelected)" class="mt-3 w-full py-2 rounded-lg bg-amber-600 text-white text-sm font-semibold touch-target">Aplicar</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <div x-show="toast.show" x-cloak x-transition class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm z-[70] px-4 py-3 rounded-lg shadow-lg" :class="toast.ok ? 'bg-emerald-600/95 text-white' : 'bg-red-600/95 text-white'">
        <p class="text-sm font-medium" x-text="toast.message"></p>
    </div>
</div>

<script>window.__escalaInit = { date: "{{ selected_date }}", shift: "{{ selected_shift | e }}" };</script>
<script src="/static/js/escala.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
{% endblock %}
