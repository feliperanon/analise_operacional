    <!-- Alpine.js + Alpine.store antes do init -->
    <script defer>
        document.addEventListener('alpine:init', () => {
            Alpine.store('ui', {
                xpPopupQueue: [],
                notificationQueue: [],
                showXpPopup(amount, callback) {
                    this.xpPopupQueue.push({ amount, callback });
                    if (this.xpPopupQueue.length === 1) this._processXpQueue();
                },
                _processXpQueue() {
                    const next = this.xpPopupQueue[0];
                    if (!next) return;
                    if (typeof window.showXpPopupGlobal === 'function') window.showXpPopupGlobal(next.amount);
                    setTimeout(() => {
                        this.xpPopupQueue.shift();
                        if (typeof next.callback === 'function') next.callback();
                        if (this.xpPopupQueue.length > 0) setTimeout(() => this._processXpQueue(), 400);
                    }, 1800);
                }
            });
        });
    </script>

    <script>

        function nlDatePartsSp(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Sao_Paulo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(date);
            const map = {};
            parts.forEach((part) => {
                if (part.type !== 'literal') map[part.type] = part.value;
            });
            return map;
        }

        function nlTodaySp() {
            const parts = nlDatePartsSp();
            return `${parts.year}-${parts.month}-${parts.day}`;
        }

        function nlShiftYmd(baseYmd, deltaDays) {
            const [year, month, day] = String(baseYmd || '').split('-').map(Number);
            if (!year || !month || !day) return '';
            const dt = new Date(Date.UTC(year, month - 1, day));
            dt.setUTCDate(dt.getUTCDate() + Number(deltaDays || 0));
            return dt.toISOString().slice(0, 10);
        }

        window.nlDatePartsSp = nlDatePartsSp;
        window.nlTodaySp = nlTodaySp;
        window.nlShiftYmd = nlShiftYmd;

        // Navegação helper
        function getBackUrl() {
            const path = window.location.pathname;
            const backRoutes = {
                '/mobile/equipment/tickets/new': '/mobile/equipment/tickets',
                '/mobile/equipment/tickets': '/mobile/dashboard',
                '/mobile/routine/checklist': '/mobile/dashboard',
                '/mobile/routine/history': '/mobile/routine/checklist',
                '/mobile/achievements': '/mobile/dashboard',
                '/mobile/game': '/mobile/dashboard'
            };
            if (path.includes('/mobile/equipment/tickets/') && path !== '/mobile/equipment/tickets') {
                const referrer = document.referrer;
                if (referrer.includes('/mobile/equipment/tickets/new')) return '/mobile/equipment/tickets/new';
                return '/mobile/equipment/tickets';
            }
            return backRoutes[path] || '/mobile/dashboard';
        }
        window.getBackUrl = getBackUrl;
    </script>

    <!-- ═══════════════════════════════════════════
         PWA OFFLINE — Fila IndexedDB + Registro SW
         ═══════════════════════════════════════════ -->
    <script>
    // ──────────────────────────────────────────────
    // IndexedDB: fila de ações offline
    // ──────────────────────────────────────────────
    const NL_DB_NAME = 'nl-entregas-offline';
    const NL_DB_VER = 1;
    const NL_STORE = 'delivery_queue';

    function nlOpenDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(NL_DB_NAME, NL_DB_VER);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(NL_STORE)) {
                    const store = db.createObjectStore(NL_STORE, { keyPath: 'queue_id', autoIncrement: true });
                    store.createIndex('ts', 'ts', { unique: false });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function nlEnqueueAction(action) {
        const db = await nlOpenDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(NL_STORE, 'readwrite');
            const store = tx.objectStore(NL_STORE);
            const req = store.add({ ...action, ts: Date.now() });
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function nlCountQueue() {
        const db = await nlOpenDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(NL_STORE, 'readonly');
            const req = tx.objectStore(NL_STORE).count();
            req.onsuccess = () => resolve(req.result || 0);
            req.onerror = () => resolve(0);
        });
    }

    async function nlReadQueue() {
        const db = await nlOpenDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(NL_STORE, 'readonly');
            const req = tx.objectStore(NL_STORE).index('ts').getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
        });
    }

    async function nlClearQueue(ids) {
        if (!ids || ids.length === 0) return;
        const db = await nlOpenDb();
        return new Promise((resolve) => {
            const tx = db.transaction(NL_STORE, 'readwrite');
            const store = tx.objectStore(NL_STORE);
            ids.forEach(id => store.delete(id));
            tx.oncomplete = resolve;
            tx.onerror = resolve;
        });
    }

    // ──────────────────────────────────────────────
    // Sincronização manual (fallback sem Background Sync API)
    // ──────────────────────────────────────────────
    window._nlSyncing = false;

    async function nlSyncQueue() {
        if (window._nlSyncing || !navigator.onLine) return;
        const actions = await nlReadQueue();
        if (!actions || actions.length === 0) return;

        window._nlSyncing = true;
        window.dispatchEvent(new CustomEvent('nl:sync-start', { detail: { count: actions.length } }));
        console.group('[NL Offline] Sincronizando', actions.length, 'ação(ões)');

        try {
            const resp = await fetch('/api/mobile/delivery/sync-batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actions })
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const result = await resp.json();
            const successIds = (result.results || [])
                .filter(r => r.success || r.already_done)
                .map(r => r.queue_id)
                .filter(Boolean);
            await nlClearQueue(successIds);
            const remaining = await nlCountQueue();
            window.dispatchEvent(new CustomEvent('nl:sync-done', {
                detail: { synced: successIds.length, remaining, results: result.results || [] }
            }));
            console.log('[NL Offline] Sincronizado:', successIds.length, 'de', actions.length);
        } catch (err) {
            console.error('[NL Offline] Erro ao sincronizar:', err);
            window.dispatchEvent(new CustomEvent('nl:sync-error', { detail: { error: err.message } }));
        } finally {
            window._nlSyncing = false;
            console.groupEnd();
        }
    }

    // Exporta helpers globais
    window.nlEnqueueAction = nlEnqueueAction;
    window.nlCountQueue = nlCountQueue;
    window.nlReadQueue = nlReadQueue;
    window.nlSyncQueue = nlSyncQueue;

    // ──────────────────────────────────────────────
    // Detecta reconexão → dispara sync
    // ──────────────────────────────────────────────
    window.addEventListener('online', () => {
        console.log('[NL Offline] Conexão restaurada — tentando sincronizar...');
        setTimeout(nlSyncQueue, 800);
    });

    // ──────────────────────────────────────────────
    // Registro do Service Worker
    // ──────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
            try {
                const reg = await navigator.serviceWorker.register('/service-worker.js', { scope: '/mobile/' });
                console.log('[SW] Registrado com escopo:', reg.scope);

                // Escuta mensagens do SW (SYNC_COMPLETE enviado após Background Sync)
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data?.type === 'SYNC_COMPLETE') {
                        console.log('[SW] SYNC_COMPLETE recebido:', event.data);
                        window.dispatchEvent(new CustomEvent('nl:sync-done', {
                            detail: { synced: event.data.synced, results: event.data.results || [] }
                        }));
                    }
                });

                // Solicita Background Sync ao reconectar (se suportado)
                window.addEventListener('online', async () => {
                    if ('sync' in reg) {
                        try { await reg.sync.register('delivery-sync'); }
                        catch (e) { /* fallback manual já registrado acima */ }
                    }
                });
            } catch (err) {
                console.warn('[SW] Falha no registro:', err.message);
            }
        });
    }
    </script>

    <!-- Banner de status offline (Alpine reativo) -->
    <div
        x-data="{
            isOnline: navigator.onLine,
            syncCount: 0,
            isSyncing: false,
            showBanner: false,
            bannerMsg: '',
            bannerColor: '',
            bannerTimeout: null,

            async init() {
                this.isOnline = navigator.onLine;
                this.syncCount = await window.nlCountQueue().catch(() => 0);
                this.updateBanner();

                window.addEventListener('online', async () => {
                    this.isOnline = true;
                    this.syncCount = await window.nlCountQueue().catch(() => 0);
                    this.updateBanner();
                });
                window.addEventListener('offline', () => {
                    this.isOnline = false;
                    this.updateBanner();
                });
                window.addEventListener('nl:sync-start', async (e) => {
                    this.isSyncing = true;
                    this.syncCount = e.detail.count || 0;
                    this.updateBanner();
                });
                window.addEventListener('nl:sync-done', async (e) => {
                    this.isSyncing = false;
                    this.syncCount = await window.nlCountQueue().catch(() => 0);
                    this.isOnline = true;
                    if (e.detail.synced > 0) {
                        this.bannerMsg = '✅ ' + e.detail.synced + ' ação(ões) sincronizadas!';
                        this.bannerColor = 'rgba(16,185,129,0.95)';
                        this.showBanner = true;
                        clearTimeout(this.bannerTimeout);
                        this.bannerTimeout = setTimeout(() => { this.showBanner = false; }, 3500);
                        // Dispara reload dos dados na página (se deliveryPageController existir)
                        if (typeof window._nlReloadDelivery === 'function') window._nlReloadDelivery();
                    } else {
                        this.updateBanner();
                    }
                });
                window.addEventListener('nl:sync-error', () => {
                    this.isSyncing = false;
                    this.updateBanner();
                });
                // Atualiza contagem periodicamente
                setInterval(async () => {
                    this.syncCount = await window.nlCountQueue().catch(() => 0);
                }, 5000);
            },

            updateBanner() {
                if (!this.isOnline) {
                    this.bannerMsg = this.syncCount > 0
                        ? '🔴 Sem internet — ' + this.syncCount + ' ação(ões) na fila'
                        : '🔴 Sem internet — modo offline';
                    this.bannerColor = 'rgba(239,68,68,0.95)';
                    this.showBanner = true;
                    clearTimeout(this.bannerTimeout);
                } else if (this.isSyncing) {
                    this.bannerMsg = '🔄 Sincronizando ' + this.syncCount + ' ação(ões)...';
                    this.bannerColor = 'rgba(245,158,11,0.95)';
                    this.showBanner = true;
                    clearTimeout(this.bannerTimeout);
                } else if (this.syncCount > 0) {
                    this.bannerMsg = '🟡 Online — ' + this.syncCount + ' ação(ões) pendentes';
                    this.bannerColor = 'rgba(245,158,11,0.95)';
                    this.showBanner = true;
                    clearTimeout(this.bannerTimeout);
                } else {
                    this.showBanner = false;
                }
            }
        }"
        x-init="init()"
        x-show="showBanner"
        x-cloak
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        :style="`background: ${bannerColor}; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 8px 16px; text-align: center; font-size: 13px; font-weight: 600; color: white; letter-spacing: 0.01em; safe-area-inset-top: env(safe-area-inset-top, 0);`"
        x-text="bannerMsg"
        style="display: none;"
    ></div>

    
</body>

</html>
