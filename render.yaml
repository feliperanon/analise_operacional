# Blueprint Render - Análise Operacional
# Deploy: dashboard.render.com → New → Blueprint
# Conecte o repositório e Render criará Web Service + PostgreSQL
# API-First: após deploy, use /docs (Swagger), /redoc e /openapi.json — ver RENDER.md

services:
  - type: web
    name: analise-operacional
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analise-db
          property: connectionString
      # Evita subir com SQLite local se o Postgres estiver inacessível (comportamento indesejado no Render).
      - key: REQUIRE_RENDER_DB
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Valor gerado automaticamente; copie em Environment se precisar na UI de importação.
      - key: IMPORT_AUTH_PASSWORD
        generateValue: true
      - key: ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

databases:
  - name: analise-db
    plan: free
    # Free expira em 30 dias; para produção use plan: basic-256mb
