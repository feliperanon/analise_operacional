# Blueprint Render - Análise Operacional
# Deploy: dashboard.render.com → New → Blueprint
# Conecte o repositório e Render criará Web Service + PostgreSQL
# API-First: após deploy, use /docs (Swagger), /redoc e /openapi.json — ver RENDER.md

services:
  - type: web
    name: analise-operacional
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: analise-db
    plan: free
    # Free expira em 30 dias; para produção use plan: basic-256mb
